  const ba=document.getElementById("btnAttach"); if(ba) ba.onclick=()=>{ B.mode="attach"; renderBattle(); };
  const bb=document.getElementById("btnBench"); if(bb) bb.onclick=()=>{ B.mode="benchPlace"; renderBattle(); };
  const bt=document.getElementById("btnTalent"); if(bt && !bt.disabled) bt.onclick=()=>useTalent();
  const ab=document.getElementById("addBench"); if(ab) ab.onclick=()=>{ B.mode="benchPlace"; renderBattle(); };
  const br=document.getElementById("btnRetreat"); if(br&&!br.disabled) br.onclick=()=>startRetreat();
  const be=document.getElementById("btnEnd"); if(be) be.onclick=()=>endPlayerTurn();
  const fb=document.getElementById("fleeBtn"); if(fb) fb.onclick=()=>{ if(confirm("Abandonner le combat ?")) endBattle(false); };
  document.querySelectorAll("[data-hand]").forEach(el=> el.onclick=()=>useHandCard(parseInt(el.dataset.hand)));
}
function bindCancel(fn){ const c=document.querySelector(".mini-cancel"); if(c) c.onclick=fn; }
function bindHandFighterPick(cb){
  document.querySelectorAll("[data-hand]").forEach(el=>{
    const idx=parseInt(el.dataset.hand); const card=B.player.hand[idx];
    if(!card||card.kind!=='fighter'){ el.classList.add("dim"); return; }
    el.onclick=()=>cb(card.id, idx);
  });
}
function attachClickTargets(cb){
  const P=B.player;
  const af=document.getElementById("f-player"); if(af && P.active){ af.classList.add("targetable"); af.onclick=()=>cb(P.active); }
  document.querySelectorAll(".player-bench .bdot[data-bench]").forEach(el=>{
    const i=parseInt(el.dataset.bench); const u=P.bench[i];
    if(!u||u.ko) return;
    el.classList.add("targetable"); el.onclick=()=>cb(u);
  });
}
function attachEnergyTo(f){
  const P=B.player;
  if(!P.energyZone){ B.mode=null; return renderBattle(); }
  const hasCatalyseur = P.bench.some(b=>b && !b.ko && b.talent==='catalyseur');
  const amount = (hasCatalyseur && f===P.active) ? 2 : 1;
  const etype=P.energyZone;
  f.energy[etype]=(f.energy[etype]||0)+amount;
  pushLog(`Énergie ${ENERGY[etype].label} attachée à ${f.name}${amount>1?' (×2 Catalyseur)':''}.`);
  P.energyZone=null; B.mode=null; renderBattle();
  // animation : énergie volante vers la cible
  const side = (f===P.active)?'player':(f===B.enemy.active?'enemy':'player');
  animEnergyFly(side, etype);
}

function useHandCard(idx){
  const P=B.player, card=P.hand[idx];
  if(!card) return;
  if(!P.active){
    if(card.kind==='fighter'){ P.active=mkFighter(card.id); P.hand.splice(idx,1); pushLog(`${P.active.name} entre au combat !`); renderBattle(); animCardPlace("f-player"); return; }
    pushLog("Pose d'abord une combattante comme carte active."); return;
  }
  if(card.kind==='fighter'){
    if(P.bench.length>=BENCH_SIZE){ pushLog("Banc plein (5 max)."); return; }
    P.bench.push(mkFighter(card.id)); P.hand.splice(idx,1);
    pushLog(`${COMBAT_POOL[card.id].name} posé au banc.`); renderBattle();
    const slot=document.querySelector(".player-bench .bdot:last-of-type"); if(slot){ slot.classList.add("fx-place"); setTimeout(()=>slot.classList.remove("fx-place"),550); }
    return;
  }
  if(card.kind==='energy'){ B.mode="attachHand"; B.handEnergyEnergy=card.energy; B.handEnergyIdx=idx; renderBattle(); return; }
  const u=UTILS[card.id];
  if(P.supportThisTurn && u.kind==='support'){ pushLog("Un seul objet support par tour."); return; }
  playUtil(card.id, idx, P, B.enemy, false);
}

/* ============================================================
   UTILITAIRES — logique partagée joueur / IA
   ============================================================ */
function discardFrom(side, handIdx){ side.discard.push(side.hand.splice(handIdx,1)[0]); }
function playUtil(uid, handIdx, side, foe, isAI){
  const u=UTILS[uid];
  // effets ne nécessitant pas de ciblage manuel, ou IA (ciblage auto)
  switch(uid){
    case "changement":{
      const benchIdx = side.bench.findIndex(b=>!b.ko);
      if(benchIdx<0){ if(!isAI) pushLog("Pas de carte au banc."); return false; }
      if(isAI){
        swapSide(side, benchIdx); pushLog(`L'adversaire change : ${side.active.name} entre en jeu.`);
        discardFrom(side,handIdx); side.supportThisTurn=true; return true;
      }
      // joueur : ciblage manuel
      B.mode="swap"; renderBattle();
      document.querySelectorAll(".player-bench .bdot[data-bench]").forEach(el=>{
        const i=parseInt(el.dataset.bench); const b=side.bench[i]; if(!b||b.ko) return;
        el.classList.add("targetable");
        el.onclick=()=>{ swapSide(side,i); pushLog(`Changement : ${side.active.name} entre en jeu.`); discardFrom(side,handIdx); B.mode=null; side.supportThisTurn=true; renderBattle(); };
      });
      bindSwapCancel(); return true;
    }
    case "villageelectrique": side.pendingStatus="paralyse"; pushLog(`${isAI?"L'adversaire prépare une paralysie":"Village Électrique : ta prochaine attaque peut paralyser"}.`); discardFrom(side,handIdx); side.supportThisTurn=true; if(!isAI) renderBattle(); return true;
    case "villagedufeu": side.pendingStatus="brule"; pushLog(`${isAI?"L'adversaire prépare une brûlure":"Village du Feu : ta prochaine attaque peut brûler"}.`); discardFrom(side,handIdx); side.supportThisTurn=true; if(!isAI) renderBattle(); return true;
    case "capsulecorp":{
      if(!foe.bench.some(b=>!b.ko)){ if(!isAI) pushLog("L'adversaire n'a pas d'autre carte."); return false; }
      forceSwap(foe); pushLog(`Capsule Corp : ${isAI?'tu es forcé':"l'adversaire est forcé"} de changer de carte active !`); discardFrom(side,handIdx); side.supportThisTurn=true; if(!isAI) renderBattle(); return true;
    }
    case "vision":
      if(isAI){ pushLog("L'adversaire observe ta main."); discardFrom(side,handIdx); side.supportThisTurn=true; return true; }
      pushLog("Vision : tu vois la main de l'adversaire."); showReveal("Main de l'adversaire", foe.hand.map(handPreviewItem)); discardFrom(side,handIdx); side.supportThisTurn=true; renderBattle(); return true;
    case "detecteur":
      if(isAI){ discardFrom(side,handIdx); side.supportThisTurn=true; return true; }
      pushLog("Détecteur : aperçu de ta pile."); showReveal("3 prochaines cartes de ta pile", side.pile.slice(0,3).map(handPreviewItem)); discardFrom(side,handIdx); side.supportThisTurn=true; renderBattle(); return true;
    case "haricot": case "armure": case "ramen": case "robeakatsuki":{
      if(isAI){
        // IA : choisit la meilleure cible automatiquement
        const target = chooseUtilTargetAI(uid, side);
        if(!target) return false;
        applyUtilTo(uid, target, side, handIdx); return true;
      }
      // joueur : passe en mode ciblage
      B.mode = uid==='robeakatsuki'?'robe':uid;
      B.pendingUtil={uid,handIdx}; renderBattle(); return true;
    }
  }
  return false;
}
function applyUtilTo(uid, f, side, handIdx){
  const u=UTILS[uid];
  if(u.kind==='attach' && f.attached){ if(side===B.player) pushLog(`${f.name} a déjà un objet équipé.`); return; }
  switch(uid){
    case "haricot":{ const heal=Math.round(f.baseMaxHp/2); f.hp=Math.min(f.maxHp,f.hp+heal); pushLog(`${side===B.enemy?"L'adversaire soigne":"Haricot :"} ${f.name} (+${heal} PV).`); floatOnCard(side===B.enemy?'enemy':'player', `+${heal}`, "heal"); break; }
    case "armure":{ f.attached="armure"; f.maxHp=f.baseMaxHp+40; f.hp+=40; pushLog(`${side===B.enemy?"L'adversaire équipe l'armure à":"Armure équipée à"} ${f.name} (+40 PV).`); break; }
    case "ramen":{ f.attached="ramen"; f.ramenTurns=2; pushLog(`${side===B.enemy?"L'adversaire équipe le ramen à":"Ramen équipé à"} ${f.name}.`); break; }
    case "robeakatsuki":{ f.attached="robeakatsuki"; f.bonusDmg=(f.bonusDmg||0)+20; pushLog(`${side===B.enemy?"L'adversaire équipe la robe à":"Robe équipée à"} ${f.name} (+20 dégâts).`); break; }
    case "sukunadoigt":{ f.attached="sukunadoigt"; f.tempBonus=25; f.tempBonusTurns=3; f.bonusDmg=(f.bonusDmg||0)+25; pushLog(`${side===B.enemy?"L'adversaire équipe le Doigt de Sukuna à":"Doigt de Sukuna équipé à"} ${f.name} (+25 dégâts, 3 tours).`); break; }
    case "mahogararoue":{ f.attached="mahogararoue"; f.roueActive=true; pushLog(`${side===B.enemy?"L'adversaire équipe la Roue de Mahoraga à":"Roue de Mahoraga équipée à"} ${f.name} (ignore la faiblesse, +5 dégâts/tour).`); break; }
    case "invertedspear":{ side.nextAtkBonus=(side.nextAtkBonus||0)+50; pushLog(`${side===B.enemy?"L'adversaire prépare la Lance Inversée":"Lance Inversée : +50 dégâts à ta prochaine attaque"}.`); break; }
    case "prisonceleste":{ const foe = side===B.player?B.enemy:B.player; foe.attackBlockedTurns=2; pushLog(`${side===B.enemy?"L'adversaire invoque la Prison Céleste":"Prison Céleste : l'adversaire ne peut plus attaquer pendant 2 tours"}.`); centerText("Prison Céleste","turn"); break; }
  }
  discardFrom(side, handIdx);
}
/* ciblage manuel (joueur) */
function applyTargetedUtil(f){
  const pu=B.pendingUtil; if(!pu) return;
  applyUtilTo(pu.uid, f, B.player, pu.handIdx);
  B.mode=null; B.pendingUtil=null; renderBattle();
}

function handPreviewItem(card){
  if(card.kind==='energy'){ const e=ENERGY[card.energy]; return `<div class="rv"><img src="${img(e.img)}"><span>Énergie ${e.label}</span></div>`; }
  if(card.kind==='fighter'){ const c=COMBAT_POOL[card.id]; return `<div class="rv"><img src="${img(c.img)}"><span>${c.name}</span></div>`; }
  const u=UTILS[card.id]; return `<div class="rv"><img src="${img(u.img)}"><span>${u.name}</span></div>`;

function showReveal(title, items){
  const ov=document.createElement("div"); ov.className="reveal-pop";
  ov.innerHTML=`<div class="reveal-pop-inner"><h4>${title}</h4><div class="rv-grid">${items.length?items.join(""):'<p>Rien à montrer.</p>'}</div><button class="btn-close">Fermer</button></div>`;
  ov.querySelector(".btn-close").onclick=()=>ov.remove(); document.body.appendChild(ov);

/* ---- retraite & swap ---- */
function startRetreat(){
  const P=B.player, act=P.active;
  if(energyCount(act)<act.retreat){ pushLog("Pas assez d'énergie pour la retraite."); return; }
  if(!P.bench.some(b=>!b.ko)){ pushLog("Aucune carte au banc."); return; }
  B.mode="swap"; renderBattle();
  document.querySelectorAll(".player-bench .bdot[data-bench]").forEach(el=>{
    const i=parseInt(el.dataset.bench); const b=P.bench[i]; if(!b||b.ko) return;
    el.classList.add("targetable");
    el.onclick=()=>{
      let toPay=act.retreat;
      for(const k of Object.keys(act.energy)){ while(act.energy[k]>0&&toPay>0){act.energy[k]--;toPay--;} if(act.energy[k]<=0) delete act.energy[k]; }
      clearStatus(act); swapSide(P,i); P.retreatedThisTurn=true; B.mode=null;
      pushLog(`Retraite : ${P.active.name} prend la relève.`); renderBattle(); animCardPlace("f-player");
    };
  });
  bindSwapCancel();
}
function bindSwapCancel(){
  const c=document.createElement("button"); c.className="float-cancel"; c.textContent="Annuler";
  c.onclick=()=>{ B.mode=null; renderBattle(); };
  const bt=app().querySelector(".battle"); if(bt) bt.appendChild(c);
}
function swapSide(side, benchIdx){ const tmp=side.active; side.active=side.bench[benchIdx]; side.bench[benchIdx]=tmp; }
function clearStatus(f){ f.status=null; f.statusTurns=0; }

/* talents activables */
function talentActivable(f){ return f && f.talent && TALENTS[f.talent] && TALENTS[f.talent].kind==='actif'; }
function talentReady(f){
  if(!talentActivable(f)) return false;
  if(f.talent==='charge') return !f.chargeUsed;       // une fois par tour
  if(f.talent==='intimidation') return !f.intimidationUsed; // une fois par combat
  return false;
}
function useTalent(){
  const P=B.player, act=P.active;
  if(!talentReady(act)) return;
  if(act.talent==='charge'){
    act.energy.universelle=(act.energy.universelle||0)+1; act.chargeUsed=true;
    pushLog(`${act.name} active Charge d'énergie (+1 énergie universelle).`);
    centerText("Charge d'énergie","turn");
  }
  if(act.talent==='intimidation'){
    const e=B.enemy.active;
    if(e && energyCount(e)>0){
      const k=Object.keys(e.energy).find(k=>e.energy[k]>0);
      if(k){ e.energy[k]--; if(e.energy[k]<=0) delete e.energy[k]; }
      act.intimidationUsed=true;
      pushLog(`${act.name} intimide ${e.name} : -1 énergie adverse.`);
      centerText("Intimidation","turn");
    } else pushLog("L'adversaire n'a pas d'énergie à retirer.");
  }
  renderBattle();
}

/* promotion du joueur après K.O. : choix manuel s'il y a 2+ cartes au banc */
function promotePlayer(){
  return new Promise(resolve=>{
    const P=B.player;
    if(P.active && !P.active.ko){ resolve(false); return; }
    const alive=P.bench.map((b,i)=>({b,i})).filter(x=>x.b && !x.b.ko);
    if(alive.length===0){ resolve(false); return; }
    if(alive.length===1){ const i=alive[0].i; P.active=P.bench.splice(i,1)[0]; pushLog(`${P.active.name} prend la relève !`); resolve(true); return; }
    // 2+ : on demande au joueur de choisir
    B.choosingActive=true; renderBattle();
    const ov=document.createElement("div"); ov.className="choose-active";
    ov.innerHTML=`<div class="ca-inner">
      <h4>Quelle carte envoyer ?</h4>
      <div class="ca-grid">
        ${alive.map(({b,i})=>`<div class="ca-card ${foilClass(b.rarity)} always" style="${rarVars(b.rarity)}" data-pick="${i}">
          <img src="${img(b.img)}" alt="${b.name}">
          <div class="ca-info"><div class="ca-name">${b.name}</div>
            <div class="ca-hp">❤ ${b.hp}/${b.maxHp}</div></div>
          ${b.talent&&TALENTS[b.talent]?`<div class="ca-talent">✦ ${TALENTS[b.talent].name}</div>`:''}
        </div>`).join("")}
      </div></div>`;
    document.body.appendChild(ov); requestAnimationFrame(()=>ov.classList.add("show"));
    ov.querySelectorAll("[data-pick]").forEach(el=>{
      el.onclick=()=>{
        const i=parseInt(el.dataset.pick);
        P.active=P.bench.splice(i,1)[0];
        pushLog(`${P.active.name} entre au combat !`);
        B.choosingActive=false;
        ov.classList.remove("show"); setTimeout(()=>ov.remove(),200);
        resolve(true);
      };
    });
  });
}
function forceSwap(side){ const i=side.bench.findIndex(b=>!b.ko); if(i<0) return; const tmp=side.active; side.active=side.bench[i]; side.bench[i]=tmp; clearStatus(side.active); }

/* ============================================================ ATTAQUE JOUEUR ============================================================ */
async function playerAttack(atkIdx){
  if(B.busy) return;
  const P=B.player, E=B.enemy, act=P.active;
  if(!act||!E.active) return;
  if(act.status==='paralyse'||act.status==='endormi'){ pushLog(`${act.name} ne peut pas attaquer.`); return; }
  if(P.attackBlockedTurns>0){ pushLog(`${act.name} est emprisonné (Prison Céleste) et ne peut pas attaquer.`); return; }
  if(!canPayCost(act, act.cost[atkIdx])){ pushLog("Énergie insuffisante."); return; }
  B.busy=true; B.mode=null; renderBattle();
  const atk=act.attacks[atkIdx];
  // bonus temporaire "Lance Inversée" (+50 prochaine attaque), consommé ici
  const spear = P.nextAtkBonus||0; if(spear){ act.bonusDmg=(act.bonusDmg||0)+spear; }
  const {dmg,weak,notes}=effDamage(act, E.active, atk.dmg, atk, B.player, B.enemy);
  if(spear){ act.bonusDmg-=spear; P.nextAtkBonus=0; }
  pushLog(`${act.name} utilise ${atk.name} !${weak?' Faiblesse !':''}${notes&&notes.length?' ('+notes.join(', ')+')':''}`);
  // talent fusionImparfaite : recul
  if(act.talent==='fusionImparfaite'){ act.hp=Math.max(1, act.hp-10); }
  animAttack("player");
  await playVFX(atk.vfx, document.getElementById("f-player"), document.getElementById("f-enemy"));
  E.active.hp-=dmg; flashHp("enemy");
  floatOnCard("enemy", `-${dmg}${weak?' ⚠':''}`, "hit");
  // talent adaptation : la cible touchée gagne +8 dégâts permanents
  if(E.active && E.active.talent==='adaptation' && dmg>0){ E.active.bonusDmg=(E.active.bonusDmg||0)+8; }
  applyPendingStatus(P, E.active);
  if(E.active.hp<=0) koActive(E, P);
  renderBattle(); await wait(450);
  await controlPhase("player");
  if(checkEnd()) return;
  if(!E.active) promoteEnemy();
  renderBattle(); await wait(250);
  if(checkEnd()) return;
  endPlayerTurn();
}
function koActive(side, scorer){
  const f=side.active; f.hp=0; f.ko=true; scorer.points++;
  pushLog(`${f.name} est K.O. !`);
  centerText(`${f.name} K.O. !`, scorer===B.player?"good":"bad");
  // animation d'explosion sur la carte K.O. (avant qu'elle disparaisse)
  animKO(side===B.player?'player':'enemy');
  side.discard.push({kind:'fighter', id:f.id});
  if(f.attached) side.discard.push({kind:'util', id:f.attached});
  side.active=null;
}
function applyPendingStatus(side, target){
  if(!side.pendingStatus||!target) return;
  if(Math.random()<0.5){
    if(side.pendingStatus==='paralyse'){ target.status='paralyse'; target.statusTurns=1; pushLog(`${target.name} est paralysé !`); }
    if(side.pendingStatus==='brule'){ target.status='brule'; target.statusTurns=2; pushLog(`${target.name} est brûlé !`); }
  } else pushLog(`L'effet de statut a échoué.`);
  side.pendingStatus=null;
}
function endPlayerTurn(){
  const P=B.player;
  ramenHeal(P.active); P.bench.forEach(ramenHeal);
  tickTurnEffects(P);
  P.retreatedThisTurn=false; P.supportThisTurn=false; P.energyZone=null;
  B.turn="enemy"; B.busy=true; B.firstTurn=false;
  renderBattle();
  if(B.online){ centerText("Tour adverse", "turn"); netHandOff(); return; }
  centerText("Tour de l'adversaire", "turn");
  setTimeout(enemyTurn, 650);
}
function ramenHeal(f){ if(f&&f.attached==='ramen'&&f.ramenTurns>0){ f.hp=Math.min(f.maxHp,f.hp+20); f.ramenTurns--; } }

/* effets liés au temps, appliqués en fin de tour du camp `side` */
function tickTurnEffects(side){
  // blocage Prison Céleste subi par ce camp : décrémente
  if(side.attackBlockedTurns>0) side.attackBlockedTurns--;
  const cards=[side.active].concat(side.bench).filter(Boolean);
  for(const f of cards){
    if(f.ko) continue;
    // Doigt de Sukuna : +25 pendant 3 tours, puis retrait
    if(f.tempBonusTurns>0){
      f.tempBonusTurns--;
      if(f.tempBonusTurns===0 && f.tempBonus){ f.bonusDmg=Math.max(0,(f.bonusDmg||0)-f.tempBonus); f.tempBonus=0; if(f.attached==='sukunadoigt') f.attached=null; }
    }
    // Roue de Mahoraga : +5 dégâts cumulés chaque tour
    if(f.roueActive){ f.bonusDmg=(f.bonusDmg||0)+5; }
  }
}

/* ============================================================
   IA ENNEMIE — tactique, évolutive, joue ses utilitaires
   ============================================================ */
async function enemyTurn(){
  const E=B.enemy, P=B.player, ai=E.ai;
  drawCard(E, true);
  for(let d=0; d<(ai.extraDraw||0); d++) drawCard(E, true);
  if(!E.active||E.active.ko){ promoteEnemy(); }
  if(!E.active){ renderBattle(); await wait(350); if(checkEnd()) return; return startPlayerTurn(); }
  newEnergy(E);

  // 1) éventuelle retraite tactique AVANT d'attacher l'énergie
  enemyMaybeRetreat(ai);
  // 2) attache l'énergie (priorité à l'actif, sinon au banc le plus prometteur)
  enemyAttachEnergy(ai);
  // 3) remplit le banc selon le profil
  enemyPlaceBench(ai);
  // 4) joue des utilitaires de façon réfléchie
  await enemyPlayUtils(ai);
  renderBattle(); await wait(500);

  // 5) statut bloquant ?
  if(E.active.status==='paralyse'||E.active.status==='endormi'){
    pushLog(`${E.active.name} est ${E.active.status==='paralyse'?'paralysé':'endormi'} et passe son tour.`);
    await wait(600); await controlPhase("enemy"); if(checkEnd()) return; return startPlayerTurn();
  }
  if(E.attackBlockedTurns>0){
    pushLog(`${E.active.name} est emprisonné (Prison Céleste) et ne peut pas attaquer.`);
    await wait(600); await controlPhase("enemy"); if(checkEnd()) return; return startPlayerTurn();
  }
  // 6) attaque : choisit selon smartAttack
  let atkIdx=-1;
  const payable=[];
  for(let i=0;i<E.active.attacks.length;i++) if(canPayCost(E.active,E.active.cost[i])) payable.push(i);
  if(payable.length===0){
    pushLog(`${E.active.name} accumule de l'énergie...`);
    await wait(450); await controlPhase("enemy"); if(checkEnd()) return; return startPlayerTurn();
  }
  if(Math.random()<ai.smartAttack){
    // meilleure attaque par dégâts effectifs
    atkIdx=payable.reduce((best,i)=> effDamage(E.active,P.active,E.active.attacks[i].dmg,E.active.attacks[i],E,P).dmg > effDamage(E.active,P.active,E.active.attacks[best].dmg,E.active.attacks[best],E,P).dmg ? i : best, payable[0]);
  } else {
    atkIdx=payable[Math.floor(Math.random()*payable.length)];
  }
  const atk=E.active.attacks[atkIdx];
  const {dmg,weak,notes}=effDamage(E.active, P.active, atk.dmg, atk, E, P);
  pushLog(`${E.active.name} utilise ${atk.name} !${weak?' Faiblesse !':''}${notes&&notes.length?' ('+notes.join(', ')+')':''}`);
  if(E.active.talent==='fusionImparfaite'){ E.active.hp=Math.max(1, E.active.hp-10); }
  B.busy=true; renderBattle();
  animAttack("enemy");
  await playVFX(atk.vfx, document.getElementById("f-enemy"), document.getElementById("f-player"));
  if(P.active){ P.active.hp-=dmg; flashHp("player"); floatOnCard("player", `-${dmg}${weak?' ⚠':''}`, "hit");
    if(P.active.talent==='adaptation' && dmg>0){ P.active.bonusDmg=(P.active.bonusDmg||0)+8; }
    applyPendingStatus(E, P.active); if(P.active.hp<=0) koActive(P, E); }
  renderBattle(); await wait(450);
  await controlPhase("enemy");
  if(checkEnd()) return;
  if(!P.active){
    await promotePlayer(); renderBattle(); await wait(250);
  }
  if(checkEnd()) return;
  startPlayerTurn();
}

/* l'IA évalue chaque utilitaire en main et joue le plus utile (1 support/tour + équipements) */
async function enemyPlayUtils(ai){
  const E=B.enemy, P=B.player;
  if(Math.random()>ai.useUtil) return; // parfois l'IA n'utilise rien (selon difficulté)
  let guard=0;
  // équipements (attach) : peut en poser plusieurs sur des cibles différentes
  // supports : un seul par tour
  while(guard++<4){
    // liste des utilitaires jouables avec leur score
    let best=null, bestScore=0, bestIdx=-1;
    E.hand.forEach((card,idx)=>{
      if(card.kind!=='util') return;
      const u=UTILS[card.id];
      if(u.kind==='support' && E.supportThisTurn) return;
      const score=evalUtil(card.id, ai);
      if(score>bestScore){ bestScore=score; best=card.id; bestIdx=idx; }
    });
    if(!best || bestScore<0.5) break;
    const ok=playUtil(best, bestIdx, E, P, true);
    renderBattle(); await wait(550);
    if(!ok) break;
    // si on vient de jouer un support, on ne pourra plus en jouer : continue pour d'éventuels attach
  }
}
/* score d'utilité contextuel d'un utilitaire pour l'IA */
function evalUtil(uid, ai){
  const E=B.enemy, P=B.player, act=E.active;
  if(!act) return 0;
  const hpRatio = act.hp/act.maxHp;
  switch(uid){
    case "haricot": // soigne : utile si l'actif (ou un banc clé) est blessé
      return hpRatio<0.55 ? (1.4-hpRatio) : 0.1;
    case "armure": // +40 PV : bon sur un actif sans équipement, surtout s'il est exposé
      return (!act.attached) ? (hpRatio<0.8?1.0:0.6) : 0;
    case "robeakatsuki": // +20 dmg : bon sur un actif chargé en énergie (prêt à frapper)
      return (!act.attached && energyCount(act)>=2) ? 0.95 : (!act.attached?0.5:0);
    case "ramen": // soin progressif : correct sur actif moyennement blessé sans équipement
      return (!act.attached && hpRatio<0.75) ? 0.8 : 0.2;
    case "changement": // change si l'actif est en danger ou en désavantage de type
      { const danger = hpRatio<0.35;
        const typeBad = P.active && WEAKNESS[act.type]===P.active.type;
        const hasBench = E.bench.some(b=>!b.ko);
        return (hasBench && (danger||typeBad)) ? (danger?1.1:0.7)*ai.lookahead+0.3 : 0; }
    case "capsulecorp": // force le joueur à changer : utile si son actif est chargé/dangereux
      { if(!P.active) return 0;
        const foeReady = energyCount(P.active)>=2;
        const foeBench = P.bench.some(b=>!b.ko);
        return (foeReady && foeBench) ? 0.85*ai.lookahead : 0.1; }
    case "villageelectrique": case "villagedufeu":
      // prépare un statut : utile si l'IA va pouvoir attaquer ce tour
      return E.pendingStatus?0:0.6*ai.useUtil;
    case "vision": case "detecteur":
      return 0.25; // info, faible priorité
    case "sukunadoigt": // +25 dmg 3 tours : bon sur actif chargé sans équipement
      return (!act.attached && energyCount(act)>=2) ? 0.9 : (!act.attached?0.45:0);
    case "mahogararoue": // ignore faiblesse + +5/tour : excellent sur actif désavantagé en type
      { const typeBad = P.active && WEAKNESS[act.type]===P.active.type;
        return (!act.attached) ? (typeBad?1.05:0.6) : 0; }
    case "invertedspear": // +50 prochaine attaque : utile si l'IA peut frapper ce tour
      return (energyCount(act)>=2) ? 0.85*ai.useUtil : 0.2;
    case "prisonceleste": // bloque le joueur 2 tours : très fort si le joueur est menaçant
      { if(!P.active) return 0;
        const foeReady = energyCount(P.active)>=2;
        return foeReady ? 1.0*ai.lookahead : 0.4; }
  }
  return 0;
}
/* choisit la cible d'un utilitaire d'équipement/soin pour l'IA */
function chooseUtilTargetAI(uid, side){
  const cands=[side.active].concat(side.bench).filter(f=>f&&!f.ko);
  if(cands.length===0) return null;
  if(uid==='haricot'){
    // soigne la carte la plus amochée (en valeur absolue de PV perdus)
    return cands.reduce((a,b)=> (b.maxHp-b.hp)>(a.maxHp-a.hp)?b:a, cands[0]);
  }
  if(uid==='armure'||uid==='ramen'){
    const free=cands.filter(f=>!f.attached);
    if(free.length===0) return null;
    // priorité à l'actif s'il est libre, sinon le plus blessé
    if(!side.active.attached) return side.active;
    return free.reduce((a,b)=> b.hp<a.hp?b:a, free[0]);
  }
  if(uid==='robeakatsuki'){
    const free=cands.filter(f=>!f.attached);
    if(free.length===0) return null;
    // priorité à l'actif chargé en énergie
    if(!side.active.attached) return side.active;
    return free.reduce((a,b)=> energyCount(b)>energyCount(a)?b:a, free[0]);
  }
  return side.active;
}
function enemyMaybeRetreat(ai){
  const E=B.enemy, P=B.player, act=E.active;
  if(!act || !P.active) return;
  if(Math.random()>ai.lookahead) return;
  const danger = act.hp/act.maxHp < 0.3;
  const typeBad = WEAKNESS[act.type]===P.active.type;
  const benchOk = E.bench.some(b=>!b.ko);
  if(benchOk && (danger||typeBad) && energyCount(act)>=act.retreat){
    // retraite vers la meilleure carte du banc (PV les plus hauts, idéalement bon type)
    let bestIdx=-1, bestScore=-1;
    E.bench.forEach((b,i)=>{ if(b.ko) return;
      let s=b.hp/b.maxHp;
      if(WEAKNESS[P.active.type]===b.type) s+=0.5; // avantage de type
      if(s>bestScore){ bestScore=s; bestIdx=i; }
    });
    if(bestIdx>=0){
      let toPay=act.retreat;
      for(const k of Object.keys(act.energy)){ while(act.energy[k]>0&&toPay>0){act.energy[k]--;toPay--;} if(act.energy[k]<=0) delete act.energy[k]; }
      clearStatus(act); swapSide(E,bestIdx);
      pushLog(`L'adversaire bat en retraite : ${E.active.name} entre en jeu.`);
    }
  }
}
function enemyAttachEnergy(ai){
  const E=B.enemy; if(!E.active) return;
  const count = ai.energyPerTurn || 1;
  for(let n=0; n<count; n++){
    // cible : l'actif, sauf si déjà prêt à frapper et qu'un banc mérite de l'énergie
    let target=E.active;
    if(ai.lookahead>0.5 && canPayCost(E.active, E.active.cost[E.active.cost.length-1])){
      const needy=E.bench.find(b=>!b.ko && energyCount(b)<2);
      if(needy) target=needy;
    }
    // énergie du bon type pour la cible
    const e = TYPE_ENERGY[target.type] || (E.energyZone || "universelle");
    target.energy[e]=(target.energy[e]||0)+1;
  }
  E.energyZone=null;
}
function enemyPlaceBench(ai){
  const E=B.enemy;
  while(E.bench.length<BENCH_SIZE){
    const fi=E.hand.findIndex(c=>c.kind==='fighter');
    if(fi<0) break;
    // selon benchFill : ne remplit pas toujours tout
    if(E.bench.length>=1 && Math.random()>ai.benchFill) break;
    E.bench.push(mkFighter(E.hand[fi].id, E.ai?E.ai.hpBoost:1)); E.hand.splice(fi,1);
  }
}
function enemyPlaceFromHand(){
  const E=B.enemy;
  const fi=E.hand.findIndex(c=>c.kind==='fighter');
  if(fi>=0){ E.active=mkFighter(E.hand[fi].id, E.ai?E.ai.hpBoost:1); E.hand.splice(fi,1); pushLog(`L'adversaire envoie ${E.active.name} !`); return; }
  let tries=0;
  while(tries<E.pile.length+1 && E.pile.length){ const c=E.pile.shift(); if(c.kind==='fighter'){ E.active=mkFighter(c.id, E.ai?E.ai.hpBoost:1); pushLog(`L'adversaire envoie ${E.active.name} !`); return; } else E.hand.push(c); tries++; }
}
function promoteEnemy(){
  const E=B.enemy;
  if(E.active && !E.active.ko) return;
  const i=E.bench.findIndex(b=>!b.ko);
  if(i>=0){ E.active=E.bench.splice(i,1)[0]; pushLog(`L'adversaire envoie ${E.active.name} !`); }
  else { E.active=null; enemyPlaceFromHand(); }
}

/* ---- contrôle (brûlure/paralysie) ---- */
async function controlPhase(who){
  const order = who==="player" ? [["enemy",B.enemy],["player",B.player]] : [["player",B.player],["enemy",B.enemy]];
  for(const [name,side] of order){
    const f=side.active; if(!f||f.ko) continue;
    if(f.status==='brule'){
      f.hp-=20; pushLog(`${f.name} subit la brûlure (-20).`);
      if(Math.random()<0.5){ clearStatus(f); pushLog(`${f.name} n'est plus brûlé.`); } else f.statusTurns--;
      if(f.hp<=0){ const scorer = name==='player'?B.enemy:B.player; koActive(side, scorer); }
    }
    if(f && f.status==='paralyse'){
      if((who==='enemy'&&name==='enemy')||(who==='player'&&name==='player')) clearStatus(f);
    }
  }
  if(B.enemy.active===null) promoteEnemy();
  if(B.player.active===null){ await promotePlayer(); }
  renderBattle(); await wait(250);
}
function startPlayerTurn(){
  const P=B.player;
  if(!B.firstTurn && B.enemy) tickTurnEffects(B.enemy);
  drawCard(P);
  newEnergy(P);
  if(P.active) P.active.chargeUsed=false;
  P.bench.forEach(b=>{ if(b) b.chargeUsed=false; });
  if(!P.active){ const i=P.bench.findIndex(b=>!b.ko); if(i>=0){ P.active=P.bench.splice(i,1)[0]; pushLog(`${P.active.name} prend la relève !`); } }
  B.turn="player"; B.busy=false; B.mode=null;
  renderBattle();
  if(checkEnd()) return;
  animDraw("player");
  centerText("À votre tour", "turn");
  pushLog("À toi de jouer.");
}

/* ============================================================ DIVERS ============================================================ */
function flashHp(side){ const el=document.getElementById("f-"+side); if(el){ el.classList.add("dmg-flash"); setTimeout(()=>el.classList.remove("dmg-flash"),350);} }
function wait(ms){ return new Promise(r=>setTimeout(r,ms)); }
function pushLog(m){ if(!B) return; B.log.push(m); if(B.log.length>4) B.log.shift(); renderLog(); }
function renderLog(){ const el=document.getElementById("battleLog"); if(el) el.innerHTML=B.log.map(l=>`<div>${l}</div>`).join(""); }

/* ---- inspection d'une carte en combat (attaques / description) ---- */
function inspectFighter(u){
  if(!u) return;
  const rr=u.rarity||"commune";
  const inBattle = !!(B && B.player && B.enemy);
  // l'adversaire potentiel pour prévisualiser la faiblesse (seulement en combat)
  let foe=null, attSide=null, defSide=null;
  if(inBattle){
    if(u===B.player.active){ foe=B.enemy.active; attSide=B.player; defSide=B.enemy; }
    else if(u===B.enemy.active){ foe=B.player.active; attSide=B.enemy; defSide=B.player; }
  }
  const moves = u.attacks.map((a,i)=>{
    const prev = inBattle ? effDamage(u, foe, a.dmg, a, attSide, defSide) : {dmg:a.dmg, weak:false};
    return `<div class="ins-move" style="--tc:${TYPES[u.type].color}">
      <div class="ins-move-top">
        <span class="ins-move-name">${a.name}${a.scale?' <span class="ins-scale">⚡×</span>':''}</span>
        <span class="ins-move-dmg">${prev.dmg}${prev.weak?' ⚠':''}</span>
      </div>
      <div class="ins-move-cost">${costLabel(u.cost[i])}</div>
    </div>`;
  }).join("");
  const weakOf = WEAKNESS[u.type];
  const tal = u.talent && TALENTS[u.talent] ? TALENTS[u.talent] : null;
  const ov=document.createElement("div"); ov.className="inspect";
  ov.innerHTML=`<div class="inspect-card ${foilClass(rr)} always" style="${rarVars(rr)}">
    <div class="ins-img"><img src="${img(u.img)}" alt="${u.name}"><div class="ins-foil"></div></div>
    <div class="ins-body">
      <div class="ins-head">
        <span class="ins-name">${u.name}</span>
        <span class="ins-rar">${starStr(rr)} ${RARITIES[rr].label}</span>
      </div>
      <div class="ins-stats">
        <span class="type-badge" style="background:${TYPES[u.type].color}">${TYPES[u.type].icon} ${TYPES[u.type].label}</span>
        <span class="hp-pill">❤ ${Math.max(0,u.hp!==undefined?u.hp:u.maxHp)}/${u.maxHp||u.hp} PV</span>
        <span class="retreat-pill">Retraite ${u.retreat}⚡</span>
      </div>
      ${tal?`<div class="ins-talent"><span class="talent-tag">✦ ${tal.name}</span> <span class="talent-kind">${tal.kind==='actif'?'activable':(tal.kind==='banc'?'au banc':'passif')}</span><div class="talent-desc">${tal.desc}</div></div>`:''}
      ${weakOf?`<div class="ins-weak">Faiblesse : subit +50% face au type <b style="color:${TYPES[weakOf].color}">${TYPES[weakOf].icon} ${TYPES[weakOf].label}</b></div>`:''}
      ${u.attached?`<div class="ins-equip">Équipé : ${UTILS[u.attached].name} — ${UTILS[u.attached].desc}</div>`:''}
      <div class="ins-moves-title">Attaques</div>
      <div class="ins-moves">${moves}</div>
    </div>
  </div>`;
  ov.onclick=()=>{ ov.classList.remove("show"); setTimeout(()=>ov.remove(),200); };
  document.body.appendChild(ov); requestAnimationFrame(()=>ov.classList.add("show"));
}
/* inspection depuis la collection : construit une vue à partir de la définition */
function inspectById(id){
  const c=COMBAT_POOL[id]; if(!c||!c.attacks) return false;
  inspectFighter({ name:c.name, img:c.img, type:c.type, rarity:c.rarity, hp:c.hp, maxHp:c.hp,
    attacks:c.attacks, cost:c.cost, retreat:c.retreat, talent:c.talent||null, energy:{}, attached:null });
  return true;
}

/* ---- texte flottant au centre de l'écran ---- */
/* ============================================================
   ANIMATIONS DE COMBAT — effets visuels riches
   ============================================================ */
function animPulse(elId, cls, dur){
  const el=document.getElementById(elId); if(!el) return;
  el.classList.add(cls);
  setTimeout(()=>el.classList.remove(cls), dur||500);
}
/* projectile d'énergie volant depuis la zone d'énergie vers une carte */
function animEnergyFly(targetSide, energyType){
  const target=document.getElementById("f-"+targetSide);
  const src=document.querySelector(".energy-bar .echip")||document.querySelector(".energy-bar");
  if(!target) return;
  const tr=target.getBoundingClientRect();
  const sr=src?src.getBoundingClientRect():{left:tr.left, top:window.innerHeight-80, width:30, height:30};
  const orb=document.createElement("div");
  orb.className="anim-energy-orb";
  const col=(ENERGY[energyType]&&ENERGY[energyType].color)||"#ffd24b";
  orb.style.setProperty("--ecol", col);
  orb.style.left=(sr.left+sr.width/2)+"px";
  orb.style.top=(sr.top+sr.height/2)+"px";
  document.body.appendChild(orb);
  requestAnimationFrame(()=>{
    orb.style.left=(tr.left+tr.width/2)+"px";
    orb.style.top=(tr.top+tr.height*0.5)+"px";
    orb.style.transform="translate(-50%,-50%) scale(.4)";
    orb.style.opacity="0.2";
  });
  setTimeout(()=>{ orb.remove(); animPulse("f-"+targetSide,"fx-energized",600); }, 480);
}
/* carte qui se pose (banc ou actif) avec impact */
function animCardPlace(elId){ animPulse(elId,"fx-place",550); }
/* pioche : la pile clignote */
function animDraw(side){
  const sel = side==='player' ? '.zone-stack .zone-card.back.you' : '.zone-stack .zone-card.back.foe';
  const el=document.querySelector(sel); if(!el) return;
  el.classList.add("fx-draw"); setTimeout(()=>el.classList.remove("fx-draw"),500);
}
/* retraite : la carte sortante glisse */
function animRetreat(side){ animPulse("f-"+side,"fx-retreat",550); }
/* KO : explosion sur la carte */
function animKO(side){
  const el=document.getElementById("f-"+side); if(!el) return;
  el.classList.add("fx-ko");
  const r=el.getBoundingClientRect();
  const boom=document.createElement("div"); boom.className="anim-ko-boom";
  boom.style.left=(r.left+r.width/2)+"px"; boom.style.top=(r.top+r.height/2)+"px";
  document.body.appendChild(boom);
  setTimeout(()=>boom.remove(), 700);
}
/* attaque : la carte attaquante charge vers l'avant */
function animAttack(side){ animPulse("f-"+side, side==='player'?"fx-lunge-up":"fx-lunge-down", 420); }

function centerText(msg, kind){
  const layer=document.getElementById("centerFx") || document.body;
  const el=document.createElement("div");
  el.className="cfx-msg cfx-"+(kind||"info");
  el.textContent=msg;
  layer.appendChild(el);
  setTimeout(()=>{ el.classList.add("out"); }, 700);
  setTimeout(()=>{ el.remove(); }, 1150);
}
/* flottant de dégâts/soin ancré sur une carte (-X PV / +X PV) */
function floatOnCard(side, text, kind){
  const card=document.getElementById("f-"+side);
  const host=document.getElementById("centerFx") || document.body;
  const el=document.createElement("div");
  el.className="dmg-float dmg-"+(kind||"hit");
  el.textContent=text;
  if(card){
    const r=card.getBoundingClientRect();
    el.style.left=(r.left+r.width/2)+"px";
    el.style.top=(r.top+r.height*0.35)+"px";
    document.body.appendChild(el);
  } else { host.appendChild(el); }
  setTimeout(()=>el.remove(), 1000);
}
function sideAlive(side){
  return (side.active && !side.active.ko) || side.bench.some(b=>!b.ko)
    || side.hand.some(c=>c.kind==='fighter') || side.pile.some(c=>c.kind==='fighter');
}
function checkEnd(){
  const P=B.player, E=B.enemy;
  if(P.points>=POINTS_TO_WIN){ endBattle(true); return true; }
  if(E.points>=POINTS_TO_WIN){ endBattle(false); return true; }
  if(!sideAlive(P)){ endBattle(false); return true; }
  if(!sideAlive(E)){ endBattle(true); return true; }
  return false;
}
function endBattle(won){
  // --- mode VERSUS en ligne ---
  if(B && B.online){
    if(!B._endNotified){ B._endNotified=true; netRelay({t:"end", winnerIsMe: won}); }
    const ov=document.createElement("div"); ov.className="opening battle-end";
    ov.innerHTML=`<div class="opening-inner" style="--accent:${won?'#7cff8f':'#ff5d5d'}">
      <h3>${won?'Victoire !':'Défaite'}</h3>
      <p class="end-sub">${won?'Tu as battu ton adversaire en ligne !':'Ton adversaire gagne cette fois.'}</p>
      <div class="end-actions">
        <button class="btn-close again">Rejouer</button>
        <button class="btn-close back" style="background:var(--bg3);color:var(--ink)">Retour au lobby</button>
      </div></div>`;
    document.body.appendChild(ov); requestAnimationFrame(()=>ov.classList.add("show"));
    ov.querySelector(".again").onclick=()=>{ ov.remove(); B=null; netRelay({t:"rematch"}); openOnlineDeckBuilder(); };
    ov.querySelector(".back").onclick=()=>{ ov.remove(); B=null; switchTab("online"); };
    return;
  }
  // --- mode solo / histoire ---
  const reward=won?BATTLE_REWARD.win:BATTLE_REWARD.lose;
  money+=reward;
  if(won && B.lvl===maxStage && maxStage<STAGES.length) maxStage++;
  persist(); updateMoneyUI();
  const lvl=B.lvl;
  const ov=document.createElement("div"); ov.className="opening battle-end";
  ov.innerHTML=`<div class="opening-inner" style="--accent:${won?'#7cff8f':'#ff5d5d'}">
    <h3>${won?'Victoire !':'Défaite'}</h3>
    <p class="end-sub">${won?`Tu as marqué ${POINTS_TO_WIN} points.`:'Tes cartes sont tombées... mais tu repars avec une récompense.'}</p>
    <div class="earned">${coinImg()} +${reward} pièces</div>
    <div class="end-actions">
      ${won&&lvl<STAGES.length?`<button class="btn-close next">Niveau suivant</button>`:''}
      <button class="btn-close again">Rejouer</button>
      <button class="btn-close back" style="background:var(--bg3);color:var(--ink)">Retour Histoire</button>
    </div></div>`;
  document.body.appendChild(ov); requestAnimationFrame(()=>ov.classList.add("show"));
  const close=()=>ov.remove();
  const nx=ov.querySelector(".next"); if(nx) nx.onclick=()=>{ close(); openDeckBuilder(Math.min(lvl+1,STAGES.length)); };
  ov.querySelector(".again").onclick=()=>{ close(); openDeckBuilder(lvl); };
  ov.querySelector(".back").onclick=()=>{ close(); B=null; switchTab("story"); };
}

</script>
<script>
/* ============================================================
   ANIME TCG — RÉSEAU (versus 1v1 par code de salon)
   Modèle : relais simple + hôte autoritaire.
   - L'hôte fait tourner le moteur de combat (B.player = hôte, B.enemy = invité).
   - Après chaque rendu, l'hôte envoie l'état complet à l'invité.
   - L'invité affiche l'état (plateau inversé) et envoie ses intentions d'action.
   ============================================================ */

const NET = {
  ws: null,
  connected: false,
  role: null,        // "host" | "guest"
  code: null,
  inGame: false,
  myDeck: null,      // deck choisi pour la partie en ligne
  peerReady: false,
  myReady: false,
};

/* URL du serveur : à adapter après hébergement.
   En local : ws://localhost:8080
   Hébergé   : wss://ton-serveur.exemple.com */
function netServerUrl(){
  // si tu héberges, remplace cette valeur par l'URL de TON serveur
  const saved = localStorage.getItem("animeTCG_server");
  return saved || "ws://localhost:8080";
}
function setServerUrl(url){ localStorage.setItem("animeTCG_server", url); }

function netConnect(onOpen, onError){
  try{
    NET.ws = new WebSocket(netServerUrl());
  }catch(e){ onError && onError("URL de serveur invalide."); return; }
  NET.ws.onopen = ()=>{ NET.connected=true; onOpen && onOpen(); };
  NET.ws.onerror = ()=>{ onError && onError("Connexion au serveur impossible."); };
  NET.ws.onclose = ()=>{ NET.connected=false; if(NET.inGame) netPeerLeft(); };
  NET.ws.onmessage = (ev)=>{
    let msg; try{ msg=JSON.parse(ev.data); }catch(e){ return; }
    netHandle(msg);
  };
}
function netSend(obj){ if(NET.ws && NET.ws.readyState===WebSocket.OPEN) NET.ws.send(JSON.stringify(obj)); }
function netRelay(payload){ netSend({ type:"relay", payload }); }

function netHandle(msg){
  switch(msg.type){
    case "created": NET.role="host"; NET.code=msg.code; renderLobbyWaiting(); break;
    case "joined":  NET.role="guest"; NET.code=msg.code; renderLobbyWaiting(); break;
    case "peer-joined": NET.peerReady=true; renderLobbyReady(); break;
    case "peer-left": netPeerLeft(); break;
    case "error": lobbyError(msg.reason); break;
    case "relay": netOnRelay(msg.payload); break;
  }
}

/* messages applicatifs relayés entre les deux joueurs */
function netOnRelay(p){
  switch(p.t){
    case "deck":            // l'autre joueur a confirmé son deck
      NET.peerDeck = p.deck; tryStartOnlineBattle(); break;
    case "state":           // reçoit l'état complet depuis l'autre
      renderRemoteState(p.state); break;
    case "end":             // l'autre signale la fin de partie
      if(B && B.online && !B._endNotified){ B._endNotified=true; endBattle(!p.winnerIsMe); } break;
    case "rematch":         // l'autre veut rejouer
      NET.peerDeck=null; openOnlineDeckBuilder(); break;
  }
}

/* ============================================================ LOBBY UI ============================================================ */
function renderOnline(){
  if(!NET.connected){
    app().innerHTML=`
      <div class="section-head"><h2>Jouer en ligne</h2>
        <p class="sub">Affronte un ami via un code de salon. Il faut un petit serveur en route (voir le dossier <b>serveur/</b> et le guide d'installation).</p></div>
      <div class="online-card">
        <label class="online-label">Adresse du serveur</label>
        <input id="srvUrl" class="online-input" value="${netServerUrl()}" placeholder="ws://localhost:8080">
        <button class="fight-btn" id="connectBtn">Se connecter</button>
        <p class="online-note">Astuce : en test local, lance le serveur puis garde <code>ws://localhost:8080</code>. Une fois hébergé, mets l'adresse en <code>wss://...</code>.</p>
      </div>`;
    document.getElementById("connectBtn").onclick=()=>{
      setServerUrl(document.getElementById("srvUrl").value.trim());
      app().innerHTML=`<div class="empty-note">Connexion…</div>`;
      netConnect(renderLobby, (err)=>{ app().innerHTML=`<div class="empty-note">${err}<br><br><button class="fight-btn" onclick="renderOnline()">Réessayer</button></div>`; });
    };
    return;
  }
  renderLobby();
}

function renderLobby(){
  app().innerHTML=`
    <div class="section-head"><h2>Jouer en ligne</h2>
      <p class="sub">Crée un salon et partage le code, ou rejoins le salon d'un ami.</p></div>
    <div class="lobby-grid">
      <div class="online-card">
        <h3 class="oc-title">Créer un salon</h3>
        <p class="online-note">Tu seras l'hôte de la partie.</p>
        <button class="fight-btn" id="createBtn">Créer un salon</button>
      </div>
      <div class="online-card">
        <h3 class="oc-title">Rejoindre</h3>
        <input id="joinCode" class="online-input" maxlength="4" placeholder="CODE (4 lettres)" style="text-transform:uppercase">
        <button class="fight-btn" id="joinBtn">Rejoindre</button>
      </div>
    </div>
    <div id="lobbyMsg" class="lobby-msg"></div>`;
  document.getElementById("createBtn").onclick=()=>netSend({type:"create"});
  document.getElementById("joinBtn").onclick=()=>{
    const code=document.getElementById("joinCode").value.toUpperCase().trim();
    if(code.length!==4){ lobbyError("Entre un code de 4 lettres."); return; }
    netSend({type:"join", code});
  };
}
function lobbyError(reason){
  const m=document.getElementById("lobbyMsg");
  if(m) m.innerHTML=`<div class="lobby-err">${reason}</div>`;
  else renderLobby();
}
function renderLobbyWaiting(){
  app().innerHTML=`
    <div class="section-head"><h2>Salon ${NET.code}</h2></div>
    <div class="online-card center">
      ${NET.role==="host"?`
        <p class="online-note">Partage ce code avec ton adversaire :</p>
        <div class="room-code">${NET.code}</div>
        <p class="online-note">En attente d'un joueur…</p>`
      :`<p class="online-note">Connecté au salon ${NET.code}.</p><p class="online-note">En attente du démarrage…</p>`}
      <div class="dot-loader"><span></span><span></span><span></span></div>
      <button class="mini-cancel" id="leaveLobby">Quitter</button>
    </div>`;
  document.getElementById("leaveLobby").onclick=()=>{ netReset(); switchTab("online"); };
}
function renderLobbyReady(){
  // les deux sont là : on choisit son deck pour la partie en ligne
  openOnlineDeckBuilder();
}

function netPeerLeft(){
  NET.inGame=false; NET.peerReady=false;
  if(currentTabIsOnline()){
    app().innerHTML=`<div class="empty-note">Ton adversaire a quitté la partie.<br><br><button class="fight-btn" onclick="netReset();switchTab('online')">Retour au lobby</button></div>`;
  }
  B=null;
}
function currentTabIsOnline(){ const t=document.querySelector(".tab.active"); return t && t.dataset.tab==="online"; }
function netReset(){
  if(NET.ws){ try{ NET.ws.close(); }catch(e){} }
  NET.ws=null; NET.connected=false; NET.role=null; NET.code=null;
  NET.inGame=false; NET.peerReady=false; NET.myReady=false; NET.peerDeck=null; NET.myDeck=null;
}

/* ============================================================ DECK BUILDER EN LIGNE ============================================================ */
function openOnlineDeckBuilder(){
  NET.myReady=false;
  buildLvl="online"; deckSel=(savedDeck||[]).filter(id=>collection[id]>0).slice(0,DECK_SIZE);
  renderOnlineDeckBuilder();
}
function renderOnlineDeckBuilder(){
  const owned=ownedDeckables();
  const nbFighters=deckSel.filter(isFighter).length;
  const full=deckSel.length===DECK_SIZE;
  const ready = full && nbFighters>=MIN_FIGHTERS;
  app().innerHTML=`
    <div class="section-head"><h2>Partie en ligne · Salon ${NET.code}</h2>
      <p class="sub">Compose ton deck de ${DECK_SIZE} cartes (min. ${MIN_FIGHTERS} combattantes). Quand vous êtes prêts tous les deux, le duel commence. Tu es ${NET.role==="host"?"l'hôte":"l'invité"}.</p></div>
    <div class="deck-zone">
      <div class="deck-counter">
        <span class="dc-num ${full?'ok':''}">${deckSel.length}/${DECK_SIZE}</span> cartes ·
        <span class="dc-fighters ${nbFighters>=MIN_FIGHTERS?'ok':'bad'}">${nbFighters} combattante(s)</span>
      </div>
      <div class="deck-slots">
        ${Array.from({length:DECK_SIZE}).map((_,i)=>{
          const id=deckSel[i]; if(!id) return `<div class="slot empty">+</div>`;
          const c=cardMeta(id);
          return `<div class="slot filled" data-rm="${i}" style="${rarVars(c.rarity)}" title="${c.name}">
            <img src="${img(c.img)}" alt="${c.name}" onerror="this.style.opacity=.2">
            <div class="slot-cat ${c.cat}">${c.cat==='fighter'?'⚔':(c.cat==='energy'?'⚡':'◆')}</div>
            <div class="slot-x">✕</div></div>`;
        }).join("")}
      </div>
      <button class="fight-btn" id="onlineReadyBtn" ${ready?'':'disabled'}>${NET.myReady?'En attente de l adversaire…':(ready?'Je suis prêt ✓':(!full?`Choisis ${DECK_SIZE-deckSel.length} carte(s)`:`Ajoute ${MIN_FIGHTERS-nbFighters} combattante(s)`))}</button>
    </div>
    <div class="lib-tabs">
      <button class="lib-tab active" data-cat="all">Tout</button>
      <button class="lib-tab" data-cat="fighter">Combat</button>
      <button class="lib-tab" data-cat="energy">Énergies</button>
      <button class="lib-tab" data-cat="util">Objets</button>
    </div>
    <div class="card-grid" id="libGrid"></div>`;
  let libFilter="all";
  function drawLib(){
    const grid=document.getElementById("libGrid");
    const items=owned.filter(({id})=> libFilter==="all" || cardMeta(id).cat===libFilter)
      .sort((a,b)=>rarityRank(cardMeta(b.id).rarity)-rarityRank(cardMeta(a.id).rarity));
    grid.innerHTML=items.map(({id,n})=>{
      const cap=Math.min(n, MAX_COPIES);
      const used=deckCountOf(id), avail=cap-used;
      return cardEl(id, {count:`${avail}/${cap}`, maxed:avail<=0, data:`data-add="${id}"`});
    }).join("");
    grid.querySelectorAll("[data-add]").forEach(el=>{
      el.removeAttribute("data-zoom");
      el.onclick=()=>{ const id=el.dataset.add;
        if(deckSel.length>=DECK_SIZE||deckCountOf(id)>=Math.min(collection[id]||0,MAX_COPIES)) return;
        deckSel.push(id); renderOnlineDeckBuilder(); };
    });
  }
  document.querySelectorAll(".lib-tab").forEach(t=> t.onclick=()=>{
    document.querySelectorAll(".lib-tab").forEach(x=>x.classList.remove("active"));
    t.classList.add("active"); libFilter=t.dataset.cat; drawLib(); });
  document.querySelectorAll(".slot.filled").forEach(s=> s.onclick=()=>{ deckSel.splice(parseInt(s.dataset.rm),1); renderOnlineDeckBuilder(); });
  const rb=document.getElementById("onlineReadyBtn");
  if(rb && ready && !NET.myReady) rb.onclick=()=>{
    NET.myReady=true; NET.myDeck=[...deckSel]; savedDeck=[...deckSel]; persist();
    netRelay({t:"deck", deck:NET.myDeck});
    renderOnlineDeckBuilder();
    tryStartOnlineBattle();
  };
  drawLib();
}

/* démarre la partie quand les deux decks sont connus ; seul l'HÔTE crée l'état */
function tryStartOnlineBattle(){
  if(!NET.myReady || !NET.peerDeck) return;
  if(NET.role!=="host") {
    // l'invité attend l'état initial de l'hôte
    app().innerHTML=`<div class="empty-note">Duel en préparation…</div>`;
    return;
  }
  // l'hôte construit l'état : player = hôte, enemy = invité
  const player=buildSide(NET.myDeck);
  const enemy=buildSide(NET.peerDeck);
  B={ online:true, role:"host", turn:"player", busy:false, log:[], firstTurn:true, player, enemy, mode:null, lvl:"online" };
  newEnergy(player);
  renderBattle();
  pushLog("Duel en ligne lancé. À toi de commencer !");
  centerText("À votre tour","turn");
  netHandOff.justStarted=true;
  // envoyer l'état initial à l'invité (qui verra "tour adverse")
  netSendState();
}

/* ============================================================ SYNCHRO D'ÉTAT (autorité alternée) ============================================================ */
function serializeState(){
  // on clone l'état sérialisable (sans fonctions). renderBattle reconstruit le DOM.
  return JSON.parse(JSON.stringify({
    turn:B.turn, busy:B.busy, log:B.log, firstTurn:B.firstTurn,
    player:B.player, enemy:B.enemy, lvl:"online"
  }));
}
function netSendState(){ netRelay({ t:"state", state: serializeState() }); }

/* l'autre joueur reçoit l'état : on inverse player/enemy pour se mettre "en bas" */
function renderRemoteState(st){
  NET.inGame=true;
  const myTurnNow = (st.turn==="enemy"); // l'expéditeur a passé la main
  B={ online:true, role:NET.role, busy:false, mode:null, lvl:"online",
      log:st.log||[], firstTurn:st.firstTurn,
      player: st.enemy, enemy: st.player,
      turn: myTurnNow ? "player" : "enemy" };
  if(myTurnNow){
    // mon tour commence : pioche + énergie de tour (logique locale)
    const P=B.player;
    if(!B._firstReceived){ /* premier état reçu : pas de pioche bonus */ }
    drawCard(P);
    newEnergy(P);
    if(!P.active){ const i=P.bench.findIndex(b=>!b.ko); if(i>=0){ P.active=P.bench.splice(i,1)[0]; } }
    renderBattle();
    if(!checkEnd()){ centerText("À votre tour","turn"); pushLog("À toi de jouer."); }
  } else {
    renderBattle();
  }
}

/* l'hôte/joueur courant passe la main : envoie l'état et attend */
function netHandOff(){
  netSendState();
  // après envoi, c'est l'autre qui joue ; mon écran reste en lecture seule
}

/* fin de partie signalée par l'autre */
function netOnEnd(){ /* géré via relay 'end' dans netOnRelay si besoin */ }

</script>
<script>
/* ============================================================
   ANIME TCG v6 — APPLICATION
   État, moteur de rareté (tirage), ouverture manuelle de booster,
   collection, fusion, navigation.
   ============================================================ */
const SAVE_KEY = "animeTCG_save_v7";
let collection = {};   // {cardId: count}
let money = START_MONEY;
let maxStage = 1;
let savedDeck = [];
let totalSpins = 0;           // nombre total de combattantes tirées
let spinsSinceMythique = 0;   // pity mythique (garanti à 12500)
let spinsSinceDivine = 0;     // pity divine (garanti à 30000, déblocable après 12500 spins)

const PITY_MYTHIQUE = 12500;
const PITY_DIVINE = 30000;
const DIVINE_UNLOCK = 12500;  // les divines ne sont tirables qu'après 12500 spins au total

function loadSave(){
  try{
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if(s){
      collection = s.collection || {};
      money = typeof s.money==="number" ? s.money : START_MONEY;
      maxStage = s.maxStage || 1;
      savedDeck = Array.isArray(s.savedDeck) ? s.savedDeck : [];
      totalSpins = s.totalSpins || 0;
      spinsSinceMythique = s.spinsSinceMythique || 0;
      spinsSinceDivine = s.spinsSinceDivine || 0;
    }
  }catch(e){ collection={}; money=START_MONEY; }
}
function persist(){
  localStorage.setItem(SAVE_KEY, JSON.stringify({collection,money,maxStage,savedDeck,totalSpins,spinsSinceMythique,spinsSinceDivine}));
}

/* éléments racine */
function app(){ return document.getElementById("view"); }
function updateMoneyUI(){ const m=document.getElementById("moneyVal"); if(m) m.textContent=money; }

/* catalogue de tout ce qui est collectionnable (hors ennemis) */
const COLLECTIBLE = Object.assign({}, CARDS, MULTI, DUO, ENERGY_CARDS, UTILS);
function catInfo(id){
  if(COMBAT_POOL[id]&&COMBAT_POOL[id].attacks&&!COMBAT_POOL[id].enemy) return {...COMBAT_POOL[id],cat:"fighter"};
  if(ENERGY_CARDS[id]) return {...ENERGY_CARDS[id],cat:"energy"};
  if(UTILS[id]) return {...UTILS[id],cat:"util"};
  return null;
}

/* ============================================================
   MOTEUR DE RARETÉ — tirage repensé
   ============================================================ */
const DUP_VALUE = { commune:4, rare:14, epique:38, legendaire:95, mythique:260 };
function dupValue(id){ const c=COLLECTIBLE[id]; return c?(DUP_VALUE[c.rarity]||5):5; }

/* pools de combattantes par anime — SANS les fusions (MULTI), jamais en pack */
function fightersOf(anime){
  const pool=[];
  for(const [id,c] of Object.entries(CARDS)) if(c.anime===anime) pool.push(id);
  for(const [id,c] of Object.entries(DUO)) if(c.anime===anime) pool.push(id);
  return pool;
}
/* utilitaires + énergies (communs aux deux animes) */
function utilEnergyPool(){
  return Object.keys(UTILS).concat(Object.keys(ENERGY_CARDS));
}

/* tire un TIER selon les poids, avec un éventuel "luckBoost" (>1 = plus rare) */
function rollTier(luckBoost){
  luckBoost = luckBoost || 1;
  // utilisé pour les UTILITAIRES : exclut mythique/divine (pas d'utils à ce tier)
  const tiers = ["commune","rare","epique","legendaire"];
  const weighted = tiers.map((r,i)=>{
    const base = RARITIES[r].weight;
    const factor = Math.pow(luckBoost, i);
    return {r, w: base*factor};
  });
  const total = weighted.reduce((a,b)=>a+b.w,0);
  let x = Math.random()*total;
  for(const it of weighted){ if(x<it.w) return it.r; x-=it.w; }
  return "commune";
}

/* ---- tirage d'une RARETÉ de combattante avec PITY progressif ----
   Mythique : base 0.01%, monte en approchant de 12500, garanti à 12500.
   Divine  : débloquée après 12500 spins ; base infime, garantie à 30000. */
function rollFighterRarity(luckBoost){
  luckBoost = luckBoost || 1;
  totalSpins++; spinsSinceMythique++; spinsSinceDivine++;

  const divineUnlocked = totalSpins >= DIVINE_UNLOCK;

  // --- pity garanti ---
  if(divineUnlocked && spinsSinceDivine >= PITY_DIVINE){ return grantRarity("divine"); }
  if(spinsSinceMythique >= PITY_MYTHIQUE){ return grantRarity("mythique"); }

  // --- chance progressive divine ---
  if(divineUnlocked){
    const pDiv = RARITIES.divine.weight/100 * (1 + 12*(spinsSinceDivine/PITY_DIVINE));
    if(Math.random()*100 < pDiv){ return grantRarity("divine"); }
  }
  // --- chance progressive mythique ---
  const pMyth = RARITIES.mythique.weight/100 * (1 + 30*(spinsSinceMythique/PITY_MYTHIQUE));
  if(Math.random()*100 < pMyth){ return grantRarity("mythique"); }

  // --- sinon, tirage normal commune..légendaire (avec boost de chance) ---
  const tiers = ["commune","rare","epique","legendaire"];
  const weighted = tiers.map((r,i)=>({r, w: RARITIES[r].weight*Math.pow(luckBoost,i)}));
  const total = weighted.reduce((a,b)=>a+b.w,0);
  let x = Math.random()*total;
  for(const it of weighted){ if(x<it.w) return it.r; x-=it.w; }
  return "commune";
}
/* réinitialise le compteur de pity correspondant et renvoie le tier */
function grantRarity(tier){
  if(tier==="mythique"){ spinsSinceMythique=0; }
  if(tier==="divine"){ spinsSinceDivine=0; spinsSinceMythique=0; }
  return tier;
}
/* choisit une carte d'un pool correspondant au tier (descend si absent, ne monte jamais vers mythique/divine) */
function pickByTier(pool, tier){
  const byRank = {};
  pool.forEach(id=>{ const r=COLLECTIBLE[id]?COLLECTIBLE[id].rarity:"commune"; (byRank[r]=byRank[r]||[]).push(id); });
  const order = RARITY_ORDER;
  const ti = order.indexOf(tier);
  // tier exact
  if(byRank[tier]&&byRank[tier].length) return byRank[tier][Math.floor(Math.random()*byRank[tier].length)];
  // sinon DESCEND uniquement (évite de promouvoir un tirage normal en mythique/divine)
  for(let d=ti-1; d>=0; d--){
    const r=order[d]; if(byRank[r]&&byRank[r].length) return byRank[r][Math.floor(Math.random()*byRank[r].length)];
  }
  // en dernier recours, monte (cas pity sur un pool filtré)
  for(let d=ti+1; d<order.length; d++){
    const r=order[d]; if(byRank[r]&&byRank[r].length) return byRank[r][Math.floor(Math.random()*byRank[r].length)];
  }
  return pool[Math.floor(Math.random()*pool.length)];
}

function addToCollection(id){
  const had = (collection[id]||0)>0;
  collection[id]=(collection[id]||0)+1;
  // les doublons ne rapportent plus rien (v7)
  return {id,isDup:had,value:0};
}

/* ============================================================
   OUVERTURE DE BOOSTER — 5 cartes
   3 premières : utilitaires/énergies (tier normal)
   2 dernières : combattantes (la toute dernière = "hit", meilleure chance)
   ============================================================ */
function openPack(anime){
  const fpool = fightersOf(anime);
  const cards = [];

  // 3 utilitaires/énergies — souvent communes (énergies), parfois mieux
  for(let i=0;i<PACK_UTILS;i++){
    if(Math.random()<0.62){
      const eids=Object.keys(ENERGY_CARDS);
      cards.push(eids[Math.floor(Math.random()*eids.length)]);
    }else{
      const tier=rollTier(1.0);
      cards.push(pickByTier(Object.keys(UTILS), tier));
    }
  }
  // 2 combattantes — la dernière a un boost de chance (slot "hit")
  for(let i=0;i<PACK_FIGHTERS;i++){
    const isLast = (i===PACK_FIGHTERS-1);
    const tier = rollFighterRarity(isLast ? 1.4 : 1.05);
    // mythique/divine : on pioche dans TOUTES les combattantes de ce tier (tous animes),
    // sinon on reste sur l'anime du pack
    let pool = fpool;
    if(tier==="mythique" || tier==="divine"){ pool = fightersAllOfTier(tier); }
    cards.push(pickByTier(pool, tier));
  }

  const results = cards.map(id=>{
    const info = addToCollection(id);
    const rarity = COLLECTIBLE[id]?COLLECTIBLE[id].rarity:"commune";
    return {id, rarity, ...info};
  });
  persist();
  return results;
}
/* toutes les combattantes (hors fusions/ennemis) d'un tier donné */
function fightersAllOfTier(tier){
  const pool=[];
  for(const [id,c] of Object.entries(CARDS)) if(c.rarity===tier && !c.enemy) pool.push(id);
  // si vide (sécurité), on retombe sur tout CARDS
  return pool.length?pool:Object.keys(CARDS);
}

/* ============================================================ FUSION ============================================================ */
function availableFusions(){ return FUSIONS; }
function canFuse(f){ return f.ingredients.every(id=>(collection[id]||0)>0); }
function doFusion(f){
  if(!canFuse(f)) return false;
  f.ingredients.forEach(id=>{ collection[id]--; if(collection[id]<=0) delete collection[id]; });
  collection[f.result]=(collection[f.result]||0)+1;
  persist();
  return true;
}

/* ============================================================ HELPERS FOIL / RARETÉ (UI) ============================================================ */
function foilClass(rarity){ const r=RARITIES[rarity]; return r?("foil foil-"+r.foil):"foil foil-none"; }
function rarVars(rarity){
  const r=RARITIES[rarity]||RARITIES.commune;
  return `--rc:${r.color};--rc2:${r.color2};--glow:${r.glow}`;
}
function typeBadge(type){
  const t=TYPES[type]; if(!t) return "";
  return `<span class="type-badge" style="background:${t.color}">${t.label}</span>`;
}
function starStr(rarity){ const r=RARITIES[rarity]||RARITIES.commune; return "★".repeat(r.stars); }

/* carte générique pour grilles (collection, boutique lib) */
function cardEl(id, opts){
  opts=opts||{};
  const c=catInfo(id); if(!c) return "";
  const owned=collection[id]||0;
  const rarity=c.rarity||"commune";
  let badge="";
  if(c.cat==="fighter") badge=`<div class="stat-line"><span class="hp-pill">❤ ${c.hp}</span>${typeBadge(c.type)}</div>`;
  else if(c.cat==="energy") badge=`<div class="stat-line"><span class="ener-pill" style="--ec:${ENERGY[c.energy].color}">${ENERGY[c.energy].label}</span></div>`;
  else badge=`<div class="util-desc">${c.desc}</div>`;
  const cnt = opts.count!==undefined ? opts.count : owned;
  return `<div class="card r-${rarity} ${foilClass(rarity)} ${opts.maxed?'maxed':''}" style="${rarVars(rarity)}"
      data-zoom="${id}" ${opts.data||''}>
    <div class="card-img">
      <img src="${img(c.img)}" alt="${c.name}" onerror="this.style.opacity=.2">
      <span class="count">×${cnt}</span>
      <div class="stars">${starStr(rarity)}</div>
      ${c.cat==='util'?`<span class="util-tag ${c.kind}">${c.kind==='attach'?'ÉQUIP':'OBJET'}</span>`:''}
    </div>
    <div class="card-body"><div class="card-name">${c.name}</div>${badge}</div>
    <div class="rarity-strip"></div>
  </div>`;
}

/* ============================================================ ONGLET BOUTIQUE ============================================================ */
function coinImg(s){ return `<img class="coin" src="${img('money')}" alt="" onerror="this.style.display='none'">`; }
function renderBoosters(){
  const divineUnlocked = totalSpins>=DIVINE_UNLOCK;
  const pMyth = Math.min(100, Math.round(spinsSinceMythique/PITY_MYTHIQUE*100));
  const pDiv = Math.min(100, Math.round(spinsSinceDivine/PITY_DIVINE*100));
  app().innerHTML=`
    <div class="section-head"><h2>Boutique</h2>
      <p class="sub">Chaque booster contient ${PACK_SIZE} cartes : ${PACK_UTILS} objets ou énergies, puis ${PACK_FIGHTERS} combattantes. Les fusions ne s'obtiennent que par fusion. Les doublons ne rapportent rien.</p></div>
    <div class="pity-zone">
      <div class="pity-bar">
        <div class="pity-head"><span class="pity-label myth">Pitié Mythique</span><span class="pity-count">${spinsSinceMythique} / ${PITY_MYTHIQUE}</span></div>
        <div class="pity-track"><div class="pity-fill myth" style="width:${pMyth}%"></div></div>
      </div>
      <div class="pity-bar">
        <div class="pity-head"><span class="pity-label div">Pitié Divine ${divineUnlocked?'':'🔒'}</span><span class="pity-count">${divineUnlocked?`${spinsSinceDivine} / ${PITY_DIVINE}`:`débloqué à ${DIVINE_UNLOCK} tirages (${totalSpins}/${DIVINE_UNLOCK})`}</span></div>
        <div class="pity-track"><div class="pity-fill div" style="width:${divineUnlocked?pDiv:Math.min(100,Math.round(totalSpins/DIVINE_UNLOCK*100))}%"></div></div>
      </div>
    </div>
    <div class="packs">
      ${Object.entries(ANIMES).map(([key,a])=>{
        const price=PACK_PRICE[key], can=money>=price;
        return `<div class="pack" style="--accent:${a.accent};--accent2:${a.accent2}">
          <div class="pack-art">
            <img src="${img(a.pack)}" alt="${a.label}" onerror="this.style.opacity=.2">
            <div class="pack-shine"></div>
            <div class="pack-info"><div class="pack-name">${a.label}</div>
              <div class="pack-desc">Booster ${PACK_SIZE} cartes</div></div>
          </div>
          <div class="pack-footer">
            <span class="pack-price">${coinImg()} ${price}</span>
          </div>
          <button class="pack-buy" data-anime="${key}" ${can?'':'disabled'}>
            ${can?`Ouvrir un booster`:`Pas assez de pièces`}
          </button>
        </div>`;
      }).join("")}
    </div>`;
  document.querySelectorAll(".pack-buy").forEach(b=>{ if(!b.disabled) b.onclick=()=>buyAndOpen(b.dataset.anime); });
}

function buyAndOpen(anime){
  const price=PACK_PRICE[anime];
  if(money<price) return;
  money-=price; updateMoneyUI(); persist();
  const results=openPack(anime);
  runPackOpening(results);
}

/* ============================================================
   OUVERTURE MANUELLE — défile carte par carte (façon Pocket)
   ============================================================ */
function runPackOpening(results){
  let idx=0;
  const ov=document.createElement("div"); ov.className="opening";
  document.body.appendChild(ov);
  requestAnimationFrame(()=>ov.classList.add("show"));

  function renderCard(){
    const res=results[idx];
    const c=COLLECTIBLE[res.id]; const rarity=res.rarity;
    const isHigh = rarityRank(rarity)>=3; // légendaire+ : rayons
    ov.innerHTML=`
      <div class="pack-stage" style="${rarVars(rarity)}">
        <button class="pack-skip">Tout révéler ▶▶</button>
        <div class="pack-progress">
          ${results.map((_,i)=>`<span class="pp-dot ${i<idx?'done':''} ${i===idx?'current':''}"></span>`).join("")}
        </div>
        <div class="pack-card-wrap">
          ${isHigh?'<div class="pack-rays"></div>':''}
          <div class="pack-card ${foilClass(rarity)} always">
            <img src="${img(c.img)}" alt="${c.name}" onerror="this.style.opacity=.2">
            <div class="pack-card-info">
              <div class="pack-card-name">${c.name}</div>
              <div class="pack-card-rar">${starStr(rarity)} ${RARITIES[rarity].label}</div>
              ${res.isDup?`<div class="pack-card-dup">Double (déjà en collection)</div>`:''}
            </div>
          </div>
        </div>
        <div class="pack-hint">${idx<results.length-1?'Touche la carte pour la suivante':'Touche pour voir le récap'}</div>
      </div>`;
    ov.querySelector(".pack-card-wrap").onclick=next;
    ov.querySelector(".pack-skip").onclick=showSummary;
    updateMoneyUI();
  }
  function next(){ idx++; if(idx>=results.length) showSummary(); else renderCard(); }
  function showSummary(){
    const earned=results.reduce((a,r)=>a+(r.value||0),0);
    const best=results.reduce((a,r)=>rarityRank(r.rarity)>rarityRank(a.rarity)?r:a, results[0]);
    ov.innerHTML=`
      <div class="pack-summary" style="${rarVars(best.rarity)}">
        <h3>Booster ouvert</h3>
        <div class="summary-grid">
          ${results.map(r=>{
            const c=COLLECTIBLE[r.id];
            return `<div class="summary-card ${foilClass(r.rarity)} always" style="${rarVars(r.rarity)}">
              <img src="${img(c.img)}" alt="${c.name}" onerror="this.style.opacity=.2">
              ${r.isDup?`<div class="sc-dup">DOUBLE</div>`:''}
            </div>`;
          }).join("")}
        </div>
        ${earned>0?`<div class="earned">${coinImg()} +${earned} pièces (doubles)</div>`:''}
        <div class="end-actions">
          <button class="btn-close again">Ouvrir un autre</button>
          <button class="btn-close coll" style="background:var(--bg3);color:var(--ink)">Voir la collection</button>
        </div>
      </div>`;
    updateMoneyUI();
    ov.querySelector(".again").onclick=()=>{ ov.remove(); switchTab("boosters"); };
    ov.querySelector(".coll").onclick=()=>{ ov.remove(); switchTab("collection"); };
  }
  renderCard();
}

/* ============================================================ ONGLET COLLECTION ============================================================ */
let collFilter="all";
function renderCollection(){
  const total=Object.keys(COLLECTIBLE).length;
  const ownedCount=Object.keys(collection).filter(id=>COLLECTIBLE[id]&&collection[id]>0).length;
  const cats=[["all","Tout"],["fighter","Combattantes"],["energy","Énergies"],["util","Objets"]];
  app().innerHTML=`
    <div class="section-head"><h2>Collection</h2>
      <p class="sub">Clique une carte pour l'agrandir et admirer son foil. Les raretés élevées brillent davantage.</p></div>
    <div class="coll-bar">
      ${cats.map(([k,l])=>`<button class="chip ${collFilter===k?'active':''}" data-f="${k}">${l}</button>`).join("")}
      <span class="coll-progress">${ownedCount}/${total} cartes débloquées</span>
    </div>
    <div class="card-grid" id="collGrid"></div>`;
  document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{ collFilter=c.dataset.f; renderCollection(); });
  drawColl();
}
function drawColl(){
  const grid=document.getElementById("collGrid");
  const ids=Object.keys(COLLECTIBLE).filter(id=>{
    if(!(collection[id]>0)) return false;
    if(collFilter==="all") return true;
    const c=catInfo(id); return c&&c.cat===collFilter;
  }).sort((a,b)=> rarityRank(COLLECTIBLE[b].rarity)-rarityRank(COLLECTIBLE[a].rarity));
  if(ids.length===0){ grid.innerHTML=`<p class="empty-note">Aucune carte ici pour l'instant. Ouvre des boosters !</p>`; return; }
  grid.innerHTML=ids.map(id=>cardEl(id)).join("");
  bindCardZoom(grid);
}

/* ============================================================ ONGLET FUSION ============================================================ */
function renderFusion(){
  app().innerHTML=`
    <div class="section-head"><h2>Fusion</h2>
      <p class="sub">Combine des cartes pour révéler leurs formes supérieures. Les ingrédients sont consommés.</p></div>
    <div class="fusion-list">
      ${availableFusions().map((f,i)=>{
        const res=COLLECTIBLE[f.result]; const rr=res.rarity;
        const ready=canFuse(f);
        return `<div class="fusion-row">
          <div class="fusion-ing">
            ${f.ingredients.map((id,j)=>{
              const c=COLLECTIBLE[id]; const have=(collection[id]||0)>0;
              return `${j>0?'<span class="fplus">+</span>':''}
                <div class="fmini ${have?'':'miss'}" style="${rarVars(c.rarity)}" title="${c.name}${have?'':' (manquante)'}">
                  <img src="${img(c.img)}" alt="${c.name}" onerror="this.style.opacity=.2"></div>`;
            }).join("")}
          </div>
          <span class="farrow">➜</span>
          <div class="fresult">
            <div class="fmini ${foilClass(rr)} always" style="${rarVars(rr)}" title="${res.name}">
              <img src="${img(res.img)}" alt="${res.name}" onerror="this.style.opacity=.2"></div>
            <div>
              <div style="font-weight:800">${res.name}</div>
              <div style="font-size:11px;color:var(--rc)">${starStr(rr)} ${RARITIES[rr].label}</div>
            </div>
            <button class="fuse-btn" data-f="${i}" ${ready?'':'disabled'}>${ready?'Fusionner':'Manque des cartes'}</button>
          </div>
        </div>`;
      }).join("")}
    </div>`;
  document.querySelectorAll(".fuse-btn").forEach(b=>{ if(!b.disabled) b.onclick=()=>{
    const f=availableFusions()[parseInt(b.dataset.f)];
    if(doFusion(f)){ updateMoneyUI(); fusionFx(f.result); }
  };});
}
function fusionFx(resultId){
  const c=COLLECTIBLE[resultId]; const rr=c.rarity;
  const ov=document.createElement("div"); ov.className="opening";
  ov.innerHTML=`<div class="pack-stage" style="${rarVars(rr)}">
    <div class="pack-card-wrap">
      ${rarityRank(rr)>=3?'<div class="pack-rays"></div>':''}
      <div class="pack-card ${foilClass(rr)} always">
        <img src="${img(c.img)}" alt="${c.name}">
        <div class="pack-card-info"><div class="pack-card-name">${c.name}</div>
          <div class="pack-card-rar">${starStr(rr)} ${RARITIES[rr].label}</div></div>
      </div>
    </div>
    <div class="pack-hint">Fusion réussie !</div>
    <div class="end-actions"><button class="btn-close ok">Continuer</button></div>
  </div>`;
  document.body.appendChild(ov); requestAnimationFrame(()=>ov.classList.add("show"));
  ov.querySelector(".ok").onclick=()=>{ ov.remove(); renderFusion(); };
}

/* ============================================================ ZOOM CARTE ============================================================ */
function bindCardZoom(scope){
  (scope||document).querySelectorAll("[data-zoom]").forEach(el=>{
    el.onclick=()=>{
      const id=el.dataset.zoom; const c=COLLECTIBLE[id]; if(!c) return;
      // combattante -> inspection complète (attaques, talent, faiblesse)
      if(COMBAT_POOL[id] && COMBAT_POOL[id].attacks && typeof inspectById==="function"){
        if(inspectById(id)) return;
      }
      const rr=c.rarity||"commune";
      // objet/énergie -> carte agrandie + description
      let info="";
      if(UTILS[id]) info=`<div class="zoom-info"><div class="zoom-title">${c.name}</div><div class="zoom-kind">${c.kind==='attach'?'Équipement':'Objet'}</div><div class="zoom-text">${c.desc}</div></div>`;
      else if(ENERGY_CARDS[id]) info=`<div class="zoom-info"><div class="zoom-title">${c.name}</div><div class="zoom-text">Énergie de type ${ENERGY[c.energy].label}.</div></div>`;
      const ov=document.createElement("div"); ov.className="zoom";
      ov.innerHTML=`<div class="zoom-wrap"><div class="zoom-card ${foilClass(rr)} always" style="${rarVars(rr)}">
        <img src="${img(c.img)}" alt="${c.name}"></div>${info}</div>`;
      document.body.appendChild(ov); requestAnimationFrame(()=>ov.classList.add("show"));
      ov.onclick=()=>{ ov.classList.remove("show"); setTimeout(()=>ov.remove(),250); };
    };
  });
}

/* ============================================================ NAVIGATION ============================================================ */
function switchTab(tab){
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.tab===tab));
  B=null;
  if(tab==="boosters") renderBoosters();
  else if(tab==="collection") renderCollection();
  else if(tab==="fusion") renderFusion();
  else if(tab==="story") renderStory();
  else if(tab==="online") renderOnline();
}

function init(){
  loadSave(); updateMoneyUI();
  document.querySelectorAll(".tab").forEach(t=> t.onclick=()=>switchTab(t.dataset.tab));
  const rb=document.getElementById("resetBtn");
  if(rb) rb.onclick=()=>{
    if(confirm("Réinitialiser toute ta progression (collection, pièces, niveaux) ?")){
      collection={}; money=START_MONEY; maxStage=1; savedDeck=[];
      persist(); updateMoneyUI(); switchTab("boosters");
    }
  };
  switchTab("boosters");
}
document.addEventListener("DOMContentLoaded", init);

</script>
