<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ANIME TCG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   ANIME TCG v6 — DESIGN SYSTEM
   Direction : "relique d'énergie". Fond bleu-nuit, accent or chaud.
   Signature : le foil holographique des cartes rares.
   ============================================================ */
:root{
  --bg:#070a14; --bg2:#0d1322; --bg3:#141d33; --panel:#101728;
  --line:#243049; --line2:#33415f;
  --ink:#eef3ff; --muted:#8b97b4; --muted2:#5e6a87;
  --gold:#ffc24b; --gold2:#ff8a3d; --gold-soft:#5a4420;
  --display:'Bebas Neue',Impact,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px; --radius-sm:10px;
  --shadow:0 18px 50px -22px rgba(0,0,0,.85);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:var(--body); color:var(--ink);
  background:
    radial-gradient(1200px 600px at 80% -10%, rgba(255,138,61,.10), transparent 60%),
    radial-gradient(900px 500px at 10% 0%, rgba(78,168,255,.08), transparent 55%),
    var(--bg);
  min-height:100vh; line-height:1.5; -webkit-font-smoothing:antialiased;
}
img{display:block;max-width:100%}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ============================================================ HEADER ============================================================ */
header{position:sticky;top:0;z-index:50;
  background:linear-gradient(180deg, rgba(7,10,20,.96), rgba(7,10,20,.80));
  backdrop-filter:blur(12px); border-bottom:1px solid var(--line)}
.bar{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:18px;
  padding:14px 22px}
.logo{font-family:var(--display);font-size:30px;letter-spacing:2px;line-height:1}
.logo b{color:var(--gold);font-weight:400}
.tabs{display:flex;gap:4px;margin-left:8px}
.tab{font-family:var(--display);letter-spacing:1.2px;font-size:18px;color:var(--muted);
  padding:8px 16px;border-radius:10px;transition:.18s;position:relative}
.tab:hover{color:var(--ink)}
.tab.active{color:#1a1206;background:linear-gradient(135deg,var(--gold),var(--gold2));
  box-shadow:0 6px 20px -8px var(--gold)}
.wallet{margin-left:auto;display:flex;align-items:center;gap:8px;
  background:var(--bg2);border:1px solid var(--line);border-radius:999px;
  padding:7px 16px 7px 8px;font-weight:800;font-size:15px}
.wallet .coin{width:26px;height:26px;border-radius:50%;object-fit:cover}
.icon-btn{font-size:12px;font-weight:700;color:var(--muted);border:1px solid var(--line);
  border-radius:9px;padding:8px 12px;transition:.18s}
.icon-btn:hover{color:var(--ink);border-color:var(--line2)}

main{max-width:1200px;margin:0 auto;padding:30px 22px 80px}
.section-head{margin-bottom:24px}
.section-head h2{font-family:var(--display);font-size:40px;letter-spacing:1px;line-height:1}
.section-head .sub{color:var(--muted);margin-top:8px;max-width:680px;font-size:14px}
.section-head .coin{width:16px;height:16px;border-radius:50%;display:inline-block;vertical-align:-3px}

/* ============================================================
   MOTEUR FOIL — appliqué via .foil-{none,sheen,holo,prism,mythic}
   Variables: --rc (couleur rareté), --rc2 (couleur claire), --glow
   ============================================================ */
.foil{position:relative;overflow:hidden}
.foil::after{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:0;transition:opacity .3s}
.foil:hover::after,.foil.always::after{opacity:1}

/* sheen : balayage diagonal lumineux (rare) */
.foil-sheen::after{
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.55) 48%,transparent 62%);
  background-size:250% 250%; animation:sheen-sweep 2.6s linear infinite; opacity:.0}
.foil-sheen:hover::after,.foil-sheen.always::after{opacity:.9}
@keyframes sheen-sweep{0%{background-position:140% 0}100%{background-position:-40% 0}}

/* holo : arc-en-ciel mouvant (épique) */
.foil-holo::after{
  background:linear-gradient(115deg,
    rgba(255,0,128,.45),rgba(120,80,255,.45),rgba(0,200,255,.45),
    rgba(0,255,170,.45),rgba(255,220,0,.45),rgba(255,0,128,.45));
  background-size:300% 300%; animation:holo-shift 3.4s ease infinite; mix-blend-mode:color-dodge}
.foil-holo:hover::after,.foil-holo.always::after{opacity:.7}
@keyframes holo-shift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

/* prism : holo + rotation de teinte + voile brillant (légendaire) */
.foil-prism::after{
  background:
    repeating-linear-gradient(125deg,
      rgba(255,255,255,.18) 0 8px, transparent 8px 18px),
    linear-gradient(115deg,
      rgba(255,0,128,.5),rgba(120,80,255,.5),rgba(0,220,255,.5),
      rgba(0,255,170,.5),rgba(255,220,60,.5),rgba(255,0,128,.5));
  background-size:auto, 300% 300%;
  animation:holo-shift 3s ease infinite, prism-rotate 6s linear infinite;
  mix-blend-mode:color-dodge}
.foil-prism:hover::after,.foil-prism.always::after{opacity:.85}
@keyframes prism-rotate{0%{filter:hue-rotate(0deg)}100%{filter:hue-rotate(360deg)}}

/* mythic : conique pulsant + rayons + teinte (mythique) */
.foil-mythic::after{
  background:
    conic-gradient(from 0deg,
      rgba(255,93,176,.6),rgba(122,240,255,.6),rgba(255,220,60,.6),
      rgba(176,107,255,.6),rgba(255,93,176,.6));
  background-size:200% 200%;
  animation:mythic-pulse 4s ease infinite, prism-rotate 5s linear infinite;
  mix-blend-mode:color-dodge}
.foil-mythic::before{content:"";position:absolute;inset:-40%;pointer-events:none;
  background:conic-gradient(from 0deg,transparent 0 12deg,rgba(255,255,255,.16) 12deg 14deg,transparent 14deg 30deg);
  animation:prism-rotate 9s linear infinite;opacity:0;transition:opacity .3s;mix-blend-mode:screen}
.foil-mythic:hover::after,.foil-mythic.always::after{opacity:.9}
.foil-mythic:hover::before,.foil-mythic.always::before{opacity:.7}
@keyframes mythic-pulse{0%,100%{background-position:0% 0%}50%{background-position:100% 100%}}

@keyframes border-glow{0%,100%{box-shadow:0 0 14px -4px var(--glow),0 0 0 1px var(--rc) inset}
  50%{box-shadow:0 0 26px 0 var(--glow),0 0 0 1px var(--rc2) inset}}

/* ============================================================ GRILLE DE CARTES (collection / boutique / deck) ============================================================ */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;transition:transform .2s, box-shadow .2s, border-color .2s;position:relative}
.card:hover{transform:translateY(-4px);border-color:var(--rc);box-shadow:0 16px 36px -18px var(--glow)}
.card .card-img{position:relative;aspect-ratio:3/4;overflow:hidden;background:var(--bg3)}
.card .card-img>img{width:100%;height:100%;object-fit:cover}
.card .count{position:absolute;top:8px;right:8px;background:rgba(7,10,20,.85);
  border:1px solid var(--line2);border-radius:999px;padding:2px 9px;font-size:11px;font-weight:800}
.card.maxed{opacity:.5;filter:grayscale(.4)}
.card-body{padding:10px 12px 13px}
.card-name{font-weight:700;font-size:14px;line-height:1.2}
.stat-line{display:flex;align-items:center;gap:6px;margin-top:7px;flex-wrap:wrap}
.hp-pill{font-size:11px;font-weight:800;color:#ff9d9d;background:rgba(255,93,93,.12);
  border-radius:6px;padding:2px 7px}
.type-badge{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;
  border-radius:6px;padding:2px 7px;color:#0a0e18}
.ener-pill{font-size:10px;font-weight:800;border-radius:6px;padding:2px 8px;
  background:color-mix(in srgb,var(--ec) 22%,transparent);color:var(--ec);border:1px solid color-mix(in srgb,var(--ec) 40%,transparent)}
.util-desc{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.35}
.util-tag{position:absolute;top:8px;left:8px;font-size:9px;font-weight:800;letter-spacing:.5px;
  border-radius:6px;padding:2px 7px;background:rgba(7,10,20,.85);border:1px solid var(--line2)}
.util-tag.attach{color:#ffd24b}.util-tag.support{color:#9fe6ff}

/* rareté : liseré + lueur + badge étoiles */
.card.r-commune{--rc:#9aa4b2;--rc2:#c8d0db;--glow:rgba(154,164,178,.4)}
.card.r-rare{--rc:#4ea8ff;--rc2:#9fd2ff;--glow:rgba(78,168,255,.55)}
.card.r-epique{--rc:#b06bff;--rc2:#e3c2ff;--glow:rgba(176,107,255,.65)}
.card.r-legendaire{--rc:#ffc24b;--rc2:#fff0b0;--glow:rgba(255,194,75,.78)}
.card.r-mythique{--rc:#ff5db0;--rc2:#7af0ff;--glow:rgba(255,93,176,.85)}
.card.r-epique,.card.r-legendaire,.card.r-mythique{border-color:color-mix(in srgb,var(--rc) 45%,var(--line))}
.card.r-legendaire,.card.r-mythique{animation:border-glow 3.2s ease-in-out infinite}
.rarity-strip{position:absolute;bottom:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--rc),var(--rc2),var(--rc))}
.stars{position:absolute;top:8px;left:50%;transform:translateX(-50%);display:flex;gap:1px;
  font-size:10px;color:var(--rc);text-shadow:0 0 6px var(--glow);opacity:0;transition:.2s}
.card:hover .stars{opacity:1}

/* ============================================================ BOUTIQUE / PACKS ============================================================ */
.packs{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px;margin-top:8px}
.pack{position:relative;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);
  background:var(--panel);transition:transform .2s, box-shadow .2s}
.pack:hover{transform:translateY(-5px);box-shadow:0 22px 50px -24px rgba(0,0,0,.9)}
.pack-art{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--bg3)}
.pack-art>img{width:100%;height:100%;object-fit:cover}
.pack-art::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 40%,rgba(7,10,20,.92))}
.pack-shine{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.25) 50%,transparent 60%);
  background-size:250% 250%;animation:sheen-sweep 3.5s linear infinite;opacity:.5}
.pack-info{position:absolute;bottom:0;left:0;right:0;padding:16px 18px}
.pack-name{font-family:var(--display);font-size:26px;letter-spacing:1px;line-height:1}
.pack-desc{font-size:12px;color:var(--muted);margin-top:4px}
.pack-buy{width:100%;margin-top:0;padding:14px;font-weight:800;font-size:15px;
  display:flex;align-items:center;justify-content:center;gap:8px;
  background:linear-gradient(135deg,var(--accent,#ff8a3d),var(--accent2,#ffd24b));color:#1a1206;
  transition:.18s}
.pack-buy:disabled{filter:grayscale(.7) brightness(.7);cursor:not-allowed}
.pack-buy .coin{width:20px;height:20px;border-radius:50%}
.pack-footer{padding:14px 18px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.pack-price{display:flex;align-items:center;gap:6px;font-weight:800}
.pack-price .coin{width:20px;height:20px;border-radius:50%}

/* ============================================================
   OUVERTURE BOOSTER MANUELLE (façon Pocket)
   ============================================================ */
.opening{position:fixed;inset:0;z-index:100;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 40%, rgba(20,29,51,.6), rgba(4,6,12,.96));
  opacity:0;transition:opacity .35s}
.opening.show{opacity:1}
.pack-stage{width:min(440px,92vw);text-align:center;position:relative}
.pack-progress{display:flex;justify-content:center;gap:8px;margin-bottom:22px}
.pp-dot{width:9px;height:9px;border-radius:50%;background:var(--line2);transition:.25s}
.pp-dot.done{background:var(--muted)}
.pp-dot.current{background:var(--gold);box-shadow:0 0 12px var(--gold);transform:scale(1.3)}
.pack-card-wrap{position:relative;aspect-ratio:3/4;border-radius:18px;margin:0 auto;
  width:min(330px,80vw);cursor:pointer;perspective:1200px}
.pack-card{position:relative;width:100%;height:100%;border-radius:18px;overflow:hidden;
  border:2px solid var(--rc);box-shadow:0 0 40px -8px var(--glow);
  animation:card-enter .5s cubic-bezier(.2,.9,.3,1.3)}
.pack-card>img{width:100%;height:100%;object-fit:cover}
@keyframes card-enter{0%{transform:translateY(28px) scale(.9) rotateY(12deg);opacity:0}
  100%{transform:none;opacity:1}}
.pack-rays{position:absolute;inset:-30%;pointer-events:none;z-index:-1;
  background:conic-gradient(from 0deg,transparent 0 8deg,var(--glow) 8deg 10deg,transparent 10deg 26deg);
  animation:prism-rotate 8s linear infinite;opacity:.7;filter:blur(1px)}
.pack-card-info{position:absolute;bottom:0;left:0;right:0;padding:16px;text-align:left;
  background:linear-gradient(180deg,transparent,rgba(4,6,12,.92))}
.pack-card-name{font-weight:800;font-size:18px}
.pack-card-rar{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;
  color:var(--rc);text-shadow:0 0 10px var(--glow);margin-top:2px}
.pack-card-dup{font-size:12px;color:var(--gold);margin-top:5px;font-weight:700}
.pack-hint{margin-top:20px;color:var(--muted);font-size:13px;letter-spacing:.3px}
.pack-skip{position:absolute;top:-44px;right:0;font-size:12px;color:var(--muted);
  border:1px solid var(--line);border-radius:8px;padding:6px 12px}
.pack-skip:hover{color:var(--ink)}

/* récap final */
.pack-summary{width:min(640px,94vw);text-align:center}
.pack-summary h3{font-family:var(--display);font-size:34px;letter-spacing:1px}
.summary-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:22px 0}
.summary-card{aspect-ratio:3/4;border-radius:10px;overflow:hidden;border:1.5px solid var(--rc);
  position:relative;box-shadow:0 0 14px -5px var(--glow)}
.summary-card>img{width:100%;height:100%;object-fit:cover}
.summary-card .sc-dup{position:absolute;bottom:0;left:0;right:0;font-size:10px;font-weight:800;
  background:rgba(7,10,20,.85);color:var(--gold);padding:2px}
@media(max-width:560px){.summary-grid{grid-template-columns:repeat(3,1fr)}}

.btn-close{margin-top:6px;padding:13px 30px;font-weight:800;border-radius:11px;
  background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1206;font-size:15px}
.btn-close:hover{filter:brightness(1.06)}

/* ============================================================ COLLECTION ============================================================ */
.coll-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.chip{font-size:13px;font-weight:700;color:var(--muted);background:var(--bg2);
  border:1px solid var(--line);border-radius:999px;padding:8px 16px;transition:.16s}
.chip:hover{color:var(--ink)}
.chip.active{color:#1a1206;background:linear-gradient(135deg,var(--gold),var(--gold2));border-color:transparent}
.empty-note{color:var(--muted);text-align:center;padding:50px 0;font-size:15px}
.coll-progress{font-size:13px;color:var(--muted);margin-left:auto;align-self:center}

/* ============================================================ FUSION ============================================================ */
.fusion-list{display:grid;gap:18px}
.fusion-row{display:flex;align-items:center;gap:16px;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--radius);padding:16px;flex-wrap:wrap}
.fusion-ing{display:flex;align-items:center;gap:10px}
.fmini{width:58px;aspect-ratio:3/4;border-radius:8px;overflow:hidden;border:1.5px solid var(--rc);position:relative}
.fmini>img{width:100%;height:100%;object-fit:cover}
.fmini.miss{filter:grayscale(1) brightness(.5)}
.fplus{font-size:22px;color:var(--muted)}
.farrow{font-size:24px;color:var(--gold);margin:0 4px}
.fresult{display:flex;align-items:center;gap:12px;margin-left:auto}
.fuse-btn{padding:11px 22px;font-weight:800;border-radius:10px;
  background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1206;transition:.16s}
.fuse-btn:disabled{filter:grayscale(.7) brightness(.6);cursor:not-allowed}

/* ============================================================ ZOOM CARTE ============================================================ */
.zoom{position:fixed;inset:0;z-index:120;display:grid;place-items:center;
  background:rgba(4,6,12,.9);opacity:0;transition:.25s;padding:20px}
.zoom.show{opacity:1}
.zoom-card{width:min(380px,86vw);aspect-ratio:3/4;border-radius:20px;overflow:hidden;
  border:2px solid var(--rc);box-shadow:0 0 60px -10px var(--glow);position:relative}
.zoom-card>img{width:100%;height:100%;object-fit:cover}

/* ============================================================ HISTOIRE ============================================================ */
.stages{display:grid;gap:18px}
.stage{display:flex;gap:18px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);padding:16px;position:relative;overflow:hidden}
.stage.cleared{border-color:color-mix(in srgb,#7cff8f 30%,var(--line))}
.stage.locked{opacity:.55}
.stage-num{font-family:var(--display);font-size:30px;color:var(--muted2);align-self:flex-start;line-height:1}
.stage-portrait{position:relative;width:120px;flex-shrink:0;aspect-ratio:3/4;border-radius:12px;
  overflow:hidden;border:1px solid var(--line2)}
.stage-portrait>img{width:100%;height:100%;object-fit:cover}
.stage-portrait .lock{position:absolute;inset:0;display:grid;place-items:center;
  background:rgba(4,6,12,.7);font-size:30px}
.clear-badge{position:absolute;bottom:0;left:0;right:0;background:rgba(124,255,143,.92);
  color:#06210b;font-size:11px;font-weight:800;text-align:center;padding:3px}
.stage-info{flex:1;min-width:200px}
.stage-name{font-family:var(--display);font-size:24px;letter-spacing:.6px}
.stage-boss{font-size:12px;color:var(--gold);font-weight:700;margin-top:2px}
.stage-intro{font-size:13px;color:var(--muted);margin:8px 0 14px}
.stage-btn{padding:10px 22px;font-weight:800;border-radius:10px;
  background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1206;transition:.16s}
.stage-btn:disabled{filter:grayscale(.8) brightness(.6);cursor:not-allowed}
.ai-tag{display:inline-block;margin-left:8px;font-size:11px;font-weight:800;color:#ff9d9d;
  background:rgba(255,93,93,.12);border-radius:6px;padding:2px 8px;vertical-align:1px}

/* ============================================================ DECK BUILDER ============================================================ */
.deck-zone{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;margin-bottom:22px}
.deck-counter{text-align:center;font-size:13px;color:var(--muted);margin-bottom:14px}
.dc-num{font-family:var(--display);font-size:22px;color:var(--ink);letter-spacing:1px}
.dc-num.ok{color:#7cff8f}
.dc-fighters.ok{color:#7cff8f;font-weight:800}
.dc-fighters.bad{color:#ff7a7a;font-weight:800}
.deck-slots{display:grid;grid-template-columns:repeat(10,1fr);gap:7px;margin-bottom:16px}
.slot{aspect-ratio:3/4;border-radius:9px;position:relative;overflow:hidden}
.slot.empty{border:1.5px dashed var(--line2);background:var(--bg2);display:grid;place-items:center;
  color:var(--muted2);font-size:17px}
.slot.filled{border:1.5px solid var(--rc);box-shadow:0 0 9px -3px var(--glow);cursor:pointer}
.slot.filled>img{width:100%;height:100%;object-fit:cover}
.slot .slot-cat{position:absolute;top:2px;left:2px;font-size:10px;line-height:1;
  background:rgba(7,10,20,.8);border-radius:4px;padding:2px 3px}
.slot .slot-cat.fighter{color:#ff9d9d}.slot .slot-cat.energy{color:#9fe6ff}.slot .slot-cat.util{color:#c9b3ff}
.slot .slot-x{position:absolute;inset:0;background:rgba(180,40,40,.72);color:#fff;
  display:none;align-items:center;justify-content:center;font-size:15px}
.slot.filled:hover .slot-x{display:flex}
.fight-btn{display:block;width:100%;padding:15px;font-weight:800;font-size:16px;border-radius:12px;
  background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1206;transition:.16s}
.fight-btn:disabled{filter:grayscale(.75) brightness(.62);cursor:not-allowed}
.lib-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.lib-tab{font-size:13px;font-weight:700;color:var(--muted);background:var(--bg2);
  border:1px solid var(--line);border-radius:999px;padding:7px 15px;transition:.16s}
.lib-tab.active{color:#1a1206;background:linear-gradient(135deg,var(--gold),var(--gold2));border-color:transparent}
@media(max-width:640px){.deck-slots{grid-template-columns:repeat(5,1fr)}}

/* ============================================================
   COMBAT — arène dynamique
   ============================================================ */
.battle{max-width:880px;margin:0 auto}

/* ---- PLATEAU POCKET ---- */
.battle.pocket .mat{display:grid;grid-template-columns:1fr 92px;gap:12px;
  background:
    radial-gradient(ellipse 80% 55% at 50% 50%, rgba(40,52,90,.55), transparent 75%),
    linear-gradient(180deg, rgba(255,120,120,.06), rgba(78,168,255,.06));
  border:1px solid var(--line);border-radius:20px;padding:14px;position:relative}
.mat-center{display:flex;flex-direction:column;gap:8px;align-items:center}
.active-row{display:flex;justify-content:center;width:100%}
.mid-divider{display:flex;align-items:center;gap:12px;width:70%;margin:2px 0;opacity:.55}
.mid-divider::before,.mid-divider::after{content:"";flex:1;height:1px;
  background:linear-gradient(90deg,transparent,var(--line2),transparent)}
.mid-divider span{font-family:var(--display);font-size:18px;letter-spacing:2px;color:var(--gold)}

/* colonne de droite : deck + défausse empilés */
.mat-side{display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:4px}
.zone-stack{display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.zone-card{width:54px;aspect-ratio:3/4;border-radius:7px;border:1px solid var(--line2)}
.zone-card.back{background:
    repeating-linear-gradient(45deg, rgba(255,194,75,.12) 0 6px, transparent 6px 12px);
  background-color:#15203a;box-shadow:inset 0 0 0 3px rgba(255,255,255,.04)}
.zone-card.back.foe{background-color:#2a1620;
  background-image:repeating-linear-gradient(45deg, rgba(255,93,109,.14) 0 6px, transparent 6px 12px)}
.zone-card.discard{background:repeating-linear-gradient(0deg, rgba(255,255,255,.04) 0 3px, transparent 3px 6px);
  background-color:#0c1120;border-style:dashed}
.zone-n{position:absolute;top:-6px;right:-6px;background:var(--bg3);border:1px solid var(--line2);
  border-radius:999px;font-size:10px;font-weight:800;padding:1px 6px;color:var(--ink)}
.zone-lbl{font-size:9px;letter-spacing:.4px;color:var(--muted2);text-transform:uppercase}
.zone-sep{height:1px;width:60%;background:var(--line);margin:2px 0}

/* énergie du tour, proéminente */
.energy-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:var(--bg2);border:1px solid var(--line2);border-radius:12px;padding:9px 14px;margin-bottom:10px}
.eb-label{font-family:var(--display);font-size:15px;letter-spacing:1px;color:var(--muted);text-transform:uppercase}
.eb-next{font-size:11px;color:var(--muted2)}
.eb-attach{flex:0 0 auto;margin-left:auto}
.eb-used{margin-left:auto;font-size:12px;color:var(--muted2);font-style:italic}

/* ---- TEXTE FLOTTANT CENTRAL ---- */
.center-fx{position:fixed;inset:0;z-index:90;pointer-events:none;display:flex;align-items:center;justify-content:center}
.cfx-msg{position:absolute;font-family:var(--display);letter-spacing:2px;text-transform:uppercase;
  padding:14px 34px;border-radius:14px;background:rgba(7,10,20,.86);border:1px solid var(--line2);
  font-size:34px;color:var(--ink);box-shadow:0 12px 40px -12px rgba(0,0,0,.8);
  animation:cfx-in .35s cubic-bezier(.2,.9,.3,1.4);white-space:nowrap}
.cfx-msg.out{animation:cfx-out .4s forwards}
.cfx-turn{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 50%,transparent);text-shadow:0 0 20px var(--glow,rgba(255,194,75,.6))}
.cfx-good{color:#7cff8f;border-color:rgba(124,255,143,.5)}
.cfx-bad{color:#ff6d6d;border-color:rgba(255,109,109,.5)}
@keyframes cfx-in{0%{opacity:0;transform:scale(.7)}100%{opacity:1;transform:scale(1)}}
@keyframes cfx-out{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.15) translateY(-10px)}}

/* flottant de dégâts/soin ancré sur une carte */
.dmg-float{position:fixed;z-index:95;pointer-events:none;transform:translate(-50%,-50%);
  font-family:var(--display);font-size:34px;letter-spacing:1px;font-weight:700;
  text-shadow:0 2px 8px rgba(0,0,0,.9);animation:dmg-rise 1s ease-out forwards}
.dmg-hit{color:#ff5d5d}
.dmg-heal{color:#7cff8f}
@keyframes dmg-rise{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}
  20%{opacity:1;transform:translate(-50%,-55%) scale(1.1)}
  100%{opacity:0;transform:translate(-50%,-130%) scale(1)}}

.turn-chip{font-family:var(--display);font-size:16px;letter-spacing:1.5px;text-transform:uppercase;
  padding:5px 16px;border-radius:999px;border:1px solid var(--line2)}
.turn-chip.you{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 50%,transparent);background:rgba(255,194,75,.08)}
.turn-chip.foe{color:#ff8a8a;border-color:rgba(255,109,109,.4);background:rgba(255,93,93,.08)}

/* ---- loupe d'inspection sur les cartes ---- */
.ins-btn{position:absolute;bottom:6px;right:6px;width:26px;height:26px;border-radius:50%;
  display:grid;place-items:center;font-size:12px;background:rgba(7,10,20,.78);
  border:1px solid var(--line2);color:var(--ink);z-index:4;transition:.15s;line-height:1}
.ins-btn:hover{background:var(--gold);color:#1a1206;transform:scale(1.1)}
.ins-btn.mini{width:18px;height:18px;font-size:9px;bottom:2px;right:2px}

/* ---- popup inspection ---- */
.inspect{position:fixed;inset:0;z-index:125;display:grid;place-items:center;padding:20px;
  background:rgba(4,6,12,.9);opacity:0;transition:.2s}
.inspect.show{opacity:1}
.inspect-card{display:flex;gap:0;flex-direction:column;width:min(380px,92vw);max-height:90vh;overflow:auto;
  border-radius:20px;border:2px solid var(--rc);box-shadow:0 0 60px -12px var(--glow);
  background:var(--panel);transform:scale(.92);transition:transform .2s}
.inspect.show .inspect-card{transform:scale(1)}
.ins-img{position:relative;aspect-ratio:16/10;overflow:hidden}
.ins-img>img{width:100%;height:100%;object-fit:cover;object-position:center 22%}
.ins-foil{position:absolute;inset:0;pointer-events:none}
.ins-body{padding:16px 18px 20px}
.ins-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ins-name{font-family:var(--display);font-size:26px;letter-spacing:.6px}
.ins-rar{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--rc)}
.ins-stats{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}
.ins-stats .type-badge{font-size:11px;padding:3px 9px}
.ins-stats .hp-pill{font-size:12px}
.retreat-pill{font-size:11px;font-weight:700;color:var(--muted);background:var(--bg2);border:1px solid var(--line2);border-radius:6px;padding:3px 9px}
.ins-weak{font-size:12px;color:var(--muted);background:var(--bg2);border:1px solid var(--line);
  border-radius:8px;padding:8px 11px;margin-bottom:8px}
.ins-equip{font-size:12px;color:#ffd9a0;background:rgba(255,194,75,.08);border:1px solid rgba(255,194,75,.3);
  border-radius:8px;padding:8px 11px;margin-bottom:8px}
.ins-moves-title{font-family:var(--display);font-size:15px;letter-spacing:1px;text-transform:uppercase;
  color:var(--muted);margin:10px 0 7px}
.ins-moves{display:flex;flex-direction:column;gap:8px}
.ins-move{border:1px solid var(--tc);border-radius:11px;padding:11px 13px;
  background:color-mix(in srgb,var(--tc) 9%,var(--bg2))}
.ins-move-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ins-move-name{font-weight:800;font-size:14px}
.ins-move-dmg{font-family:var(--display);font-size:24px;letter-spacing:1px;color:var(--tc)}
.ins-move-cost{display:flex;gap:3px;margin-top:7px}

/* ---- indicateur logique des types (coin) ---- */
.type-key{position:fixed;right:14px;bottom:14px;z-index:40;background:rgba(7,10,20,.9);
  border:1px solid var(--line2);border-radius:12px;padding:9px 12px;backdrop-filter:blur(6px);
  box-shadow:0 10px 30px -12px rgba(0,0,0,.8);max-width:200px}
.tk-title{font-family:var(--display);font-size:13px;letter-spacing:1px;color:var(--gold);text-transform:uppercase;margin-bottom:6px}
.tk-cycle{display:flex;align-items:center;gap:5px;justify-content:center}
.tk-node{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;
  border:1.5px solid var(--tc);color:var(--tc);background:color-mix(in srgb,var(--tc) 12%,transparent)}
.tk-arrow{color:var(--muted2);font-size:11px}
.tk-legend{font-size:9px;color:var(--muted2);margin-top:6px;line-height:1.4;text-align:center}
@media(max-width:680px){
  .type-key{right:8px;bottom:8px;padding:7px 9px;max-width:150px}
  .tk-legend{display:none}
}
.scoreboard{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 18px;margin-bottom:14px}
.score{font-size:13px;font-weight:700;color:var(--muted)}
.score.you{text-align:right}
.score b{font-family:var(--display);font-size:26px;letter-spacing:1px;display:inline-block;margin:0 2px}
.score.you b{color:var(--gold)}.score.enemy b{color:#ff7a7a}
.pips{display:inline-flex;gap:3px;vertical-align:2px;margin-left:6px}
.pip{width:9px;height:9px;border-radius:50%;background:var(--line2)}
.pip.on{background:currentColor}
.score.you .pip.on{background:var(--gold);box-shadow:0 0 7px var(--gold)}
.score.enemy .pip.on{background:#ff7a7a;box-shadow:0 0 7px #ff7a7a}
.energy-zone{display:flex;flex-direction:column;align-items:center;gap:2px}
.ez-label{font-size:9px;letter-spacing:1.5px;color:var(--muted2);text-transform:uppercase}
.ez-now{display:flex;align-items:center;gap:6px}
.echip{width:40px;height:40px;border-radius:50%;overflow:hidden;border:2px solid var(--ec);
  box-shadow:0 0 14px -2px var(--ec);display:grid;place-items:center;background:var(--bg3)}
.echip>img{width:100%;height:100%;object-fit:cover}
.echip.sm{width:22px;height:22px;border-width:1.5px;opacity:.7}
.ez-empty{color:var(--muted2);font-size:20px}
.ez-next{display:flex;align-items:center;gap:4px;font-size:9px;color:var(--muted2)}

.piles-row{display:flex;gap:12px;justify-content:center;margin:8px 0}
.pile-chip{font-size:11px;font-weight:700;color:var(--muted);background:var(--bg2);
  border:1px solid var(--line);border-radius:8px;padding:4px 11px}
.pile-chip .pc-ic{margin-right:4px;opacity:.75}

/* bancs */
.bench{display:flex;gap:9px;justify-content:center;min-height:60px;align-items:center;margin:6px 0}
.bench-empty{color:var(--muted2);font-size:11px;font-style:italic}
.bdot{width:50px;aspect-ratio:3/4;border-radius:9px;overflow:hidden;position:relative;
  border:1.5px solid var(--rc);box-shadow:0 0 8px -3px var(--glow);transition:transform .15s}
.bdot>img{width:100%;height:100%;object-fit:cover}
.bdot.pickable{cursor:pointer}.bdot.pickable:hover{transform:translateY(-3px)}
.bdot.ko{filter:grayscale(1) brightness(.45)}
.bdot .bx{position:absolute;inset:0;display:grid;place-items:center;color:#ff5d5d;font-size:20px;font-weight:800}
.bdot .eq-dot{position:absolute;top:1px;right:1px;font-size:10px}
.bdot .bench-e{position:absolute;bottom:1px;left:1px;font-size:8px;font-weight:800;color:var(--gold);
  background:rgba(7,10,20,.8);border-radius:4px;padding:0 3px}
.bdot.add-bench{display:grid;place-items:center;border:2px dashed var(--gold);color:var(--gold);
  font-size:22px;background:rgba(255,194,75,.08);box-shadow:none}
.bdot.add-bench:hover{background:rgba(255,194,75,.16)}
.bdot.targetable{outline:2px solid var(--gold);outline-offset:2px;cursor:pointer;animation:border-glow 1.4s infinite}

/* arène centrale */
.arena{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;
  background:radial-gradient(ellipse at center, rgba(20,29,51,.7), transparent 75%);
  padding:18px 8px;border-radius:18px;margin:8px 0}
.vs-flash{font-family:var(--display);font-size:30px;color:var(--gold);letter-spacing:2px;
  text-shadow:0 0 18px var(--gold);opacity:.85}
.fcard{position:relative;border-radius:16px;overflow:hidden;border:2px solid var(--rc);
  box-shadow:0 0 30px -10px var(--glow);background:var(--bg3);width:168px}
.active-row.player .fcard{width:200px;box-shadow:0 0 38px -8px var(--glow)}
.active-row.enemy .fcard{width:168px}
.fcard.empty{aspect-ratio:3/4;display:grid;place-items:center;border:2px dashed var(--line2);
  box-shadow:none;color:var(--muted2);font-size:13px;text-align:center;padding:10px;width:168px}
.active-row.player .fcard.empty{width:200px}
.fcard-img{position:relative;aspect-ratio:1/1;overflow:hidden}
.fcard-img>img{width:100%;height:100%;object-fit:cover}
.fcard.enemy-side .fcard-img{aspect-ratio:3/4}
.fcard.player-side .fcard-img{aspect-ratio:3/4}
.ftype{position:absolute;top:8px;left:8px;width:26px;height:26px;border-radius:50%;
  display:grid;place-items:center;font-size:13px;background:rgba(7,10,20,.82);border:1.5px solid var(--tc);color:var(--tc)}
.status-badge{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;
  display:grid;place-items:center;font-size:13px;background:rgba(7,10,20,.82);border:1.5px solid var(--sc)}
.equip-tag{position:absolute;top:38px;right:8px;font-size:9px;font-weight:800;color:var(--gold);
  background:rgba(7,10,20,.82);border-radius:5px;padding:2px 6px}
.fcard-info{padding:10px 12px 12px}
.fname{font-weight:800;font-size:15px}
.hpbar{height:7px;border-radius:6px;background:var(--bg);overflow:hidden;margin:7px 0 4px;border:1px solid var(--line)}
.hpfill{height:100%;border-radius:6px;transition:width .45s cubic-bezier(.3,1,.4,1)}
.hptxt{font-size:11px;color:var(--muted);font-weight:600}
.eatt-row{display:flex;gap:3px;flex-wrap:wrap;margin-top:7px}
.eatt{width:11px;height:11px;border-radius:50%;background:var(--ec);box-shadow:0 0 6px -1px var(--ec)}
.dmg-flash{animation:dmg-shake .35s}
@keyframes dmg-shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* journal */
.battle-log{background:var(--bg2);border:1px solid var(--line);border-radius:12px;
  padding:10px 16px;font-size:13px;color:var(--muted);min-height:64px;margin:10px 0}
.battle-log div{padding:1px 0;animation:log-in .3s}
.battle-log div:last-child{color:var(--ink);font-weight:600}
@keyframes log-in{0%{opacity:0;transform:translateY(4px)}100%{opacity:1}}

/* contrôles + main */
.controls{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.wait{text-align:center;color:var(--muted);font-style:italic;padding:14px}
.mode-banner{background:rgba(255,194,75,.1);border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);
  border-radius:10px;padding:11px 14px;font-size:13px;font-weight:600;display:flex;
  align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.mini-cancel{font-size:12px;font-weight:700;color:var(--muted);border:1px solid var(--line2);
  border-radius:8px;padding:6px 12px}
.mini-cancel:hover{color:var(--ink)}
.hand-bar{display:flex;gap:9px;overflow-x:auto;padding:10px 2px;margin-bottom:6px;scrollbar-width:thin}
.hcard{flex-shrink:0;width:66px;border-radius:9px;overflow:hidden;border:1.5px solid var(--line2);
  position:relative;cursor:pointer;transition:transform .15s;background:var(--bg3)}
.hcard:hover{transform:translateY(-5px)}
.hcard>img{width:100%;aspect-ratio:3/4;object-fit:cover}
.hcard .hlabel{display:block;font-size:9px;font-weight:700;text-align:center;padding:3px 2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--bg2)}
.hcard.energy{border-color:var(--ec)}
.hcard.fighter{border-color:var(--rc)}
.hcard.fighter .hcard-hp{position:absolute;top:2px;right:2px;font-size:9px;font-weight:800;
  color:#fff;background:rgba(220,60,60,.88);border-radius:5px;padding:0 4px}
.hcard.util.attach{border-color:#ffd24b}.hcard.util.support{border-color:#9fe6ff}
.hcard.dim{opacity:.32;pointer-events:none}
.hand-empty{color:var(--muted2);font-size:12px;font-style:italic;padding:14px}
.action-row,.action-row2{display:flex;gap:9px;flex-wrap:wrap;margin-top:6px}
.act-btn{flex:1;min-width:120px;padding:11px;font-weight:700;font-size:13px;border-radius:10px;
  border:1px solid var(--line2);background:var(--bg2);transition:.16s;display:flex;
  align-items:center;justify-content:center;gap:7px}
.act-btn:hover:not(:disabled){border-color:var(--gold);color:var(--gold)}
.act-btn:disabled{opacity:.4;cursor:not-allowed}
.act-btn.energy{border-color:color-mix(in srgb,#b06bff 50%,transparent);color:#d9b8ff}
.act-btn.end{background:var(--bg3)}
.act-btn .echip{width:24px;height:24px}
.flee{font-size:12px;color:var(--muted2);padding:11px 16px}
.flee:hover{color:#ff7a7a}
.moves{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.move{text-align:left;border:1px solid var(--tc);border-radius:11px;padding:11px 13px;
  background:color-mix(in srgb,var(--tc) 9%,var(--bg2));transition:.15s}
.move:hover:not(:disabled){background:color-mix(in srgb,var(--tc) 18%,var(--bg2));transform:translateY(-2px)}
.move:disabled{opacity:.4;cursor:not-allowed;border-color:var(--line2)}
.move-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.move-name{font-weight:800;font-size:13px}
.move-cost{display:flex;gap:2px}
.ecost{width:11px;height:11px;border-radius:50%;background:var(--ec);box-shadow:0 0 5px -1px var(--ec)}
.move-dmg{font-family:var(--display);font-size:24px;letter-spacing:1px;color:var(--tc);margin-top:3px;display:block}
.status-note{font-size:12px;color:#ffb37a;background:rgba(255,138,61,.1);border-radius:8px;
  padding:8px 12px;margin-top:8px;text-align:center}
.float-cancel{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:30;
  background:var(--bg3);border:1px solid var(--line2);border-radius:10px;padding:11px 22px;
  font-weight:700;color:var(--ink)}

/* reveal popup (vision / detecteur) */
.reveal-pop{position:fixed;inset:0;z-index:130;display:grid;place-items:center;
  background:rgba(4,6,12,.88);padding:20px}
.reveal-pop-inner{background:var(--panel);border:1px solid var(--line2);border-radius:16px;
  padding:24px;max-width:480px;width:100%;text-align:center}
.reveal-pop-inner h4{font-family:var(--display);font-size:24px;letter-spacing:.6px;margin-bottom:16px}
.rv-grid{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:18px}
.rv{width:74px}
.rv img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;border:1px solid var(--line2)}
.rv span{display:block;font-size:10px;color:var(--muted);margin-top:4px}

/* fin de combat */
.battle-end .opening-inner{background:var(--panel);border:1px solid var(--line2);border-radius:20px;
  padding:34px;text-align:center;width:min(440px,92vw)}
.battle-end h3{font-family:var(--display);font-size:42px;letter-spacing:1px;color:var(--accent)}
.end-sub{color:var(--muted);margin:8px 0 16px;font-size:14px}
.earned{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:18px;
  background:var(--bg2);border:1px solid var(--line2);border-radius:999px;padding:9px 20px}
.earned .coin{width:22px;height:22px;border-radius:50%}
.end-actions{display:flex;gap:10px;justify-content:center;margin-top:22px;flex-wrap:wrap}

/* ============================================================ RESPONSIVE ============================================================ */
@media(max-width:680px){
  .bar{gap:10px;padding:12px 14px;flex-wrap:wrap}
  .logo{font-size:24px}.tab{font-size:15px;padding:6px 11px}
  .section-head h2{font-size:30px}
  .moves{grid-template-columns:1fr}
  .arena{gap:8px}.vs-flash{font-size:20px}
  main{padding:20px 14px 70px}
}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.05s!important}
}

/* ============================================================ EN LIGNE (lobby / salon) ============================================================ */
.lobby-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:640px}
@media(max-width:560px){.lobby-grid{grid-template-columns:1fr}}
.online-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:22px;display:flex;flex-direction:column;gap:12px;max-width:520px}
.online-card.center{align-items:center;text-align:center;margin:0 auto}
.oc-title{font-family:var(--display);font-size:24px;letter-spacing:.6px}
.online-label{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.online-input{background:var(--bg2);border:1px solid var(--line2);border-radius:10px;
  padding:12px 14px;color:var(--ink);font-size:16px;font-weight:600;outline:none}
.online-input:focus{border-color:var(--gold)}
.online-note{font-size:12px;color:var(--muted);line-height:1.5}
.online-note code{background:var(--bg2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:11px}
.room-code{font-family:var(--display);font-size:64px;letter-spacing:10px;color:var(--gold);
  text-shadow:0 0 30px rgba(255,194,75,.5);padding:10px 0 4px;user-select:all}
.lobby-msg{margin-top:16px}
.lobby-err{background:rgba(255,93,93,.1);border:1px solid rgba(255,93,93,.4);color:#ff9d9d;
  border-radius:10px;padding:11px 14px;font-size:13px;font-weight:600;max-width:520px}
.dot-loader{display:flex;gap:7px;margin:6px 0}
.dot-loader span{width:9px;height:9px;border-radius:50%;background:var(--gold);opacity:.4;animation:dot-bounce 1.2s infinite}
.dot-loader span:nth-child(2){animation-delay:.2s}
.dot-loader span:nth-child(3){animation-delay:.4s}
@keyframes dot-bounce{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-5px)}}

/* ============================================================ TALENTS & CHOIX D'ACTIF ============================================================ */
.fcard-talent{font-size:10px;font-weight:800;color:#ffd9a0;background:rgba(255,194,75,.12);
  border:1px solid rgba(255,194,75,.35);border-radius:6px;padding:2px 7px;margin:4px 0 2px;display:inline-block}
.talent-btn{border-color:rgba(255,194,75,.5)!important;color:#ffd9a0!important}
.talent-btn:hover:not(:disabled){background:rgba(255,194,75,.12)!important}
.ins-talent{background:rgba(255,194,75,.08);border:1px solid rgba(255,194,75,.3);border-radius:10px;
  padding:10px 12px;margin-bottom:10px}
.talent-tag{font-weight:800;color:#ffd9a0;font-size:13px}
.talent-kind{font-size:10px;color:var(--muted2);text-transform:uppercase;letter-spacing:.5px;margin-left:6px}
.talent-desc{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.45}
.ins-scale{color:#ffd24b;font-size:11px}

/* popup choix de carte active après K.O. */
.choose-active{position:fixed;inset:0;z-index:128;display:grid;place-items:center;padding:20px;
  background:rgba(4,6,12,.92);opacity:0;transition:.2s}
.choose-active.show{opacity:1}
.ca-inner{background:var(--panel);border:1px solid var(--line2);border-radius:18px;padding:24px;
  max-width:620px;width:100%;text-align:center}
.ca-inner h4{font-family:var(--display);font-size:26px;letter-spacing:.6px;margin-bottom:18px}
.ca-grid{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.ca-card{width:150px;border-radius:14px;overflow:hidden;border:2px solid var(--rc);cursor:pointer;
  background:var(--bg3);box-shadow:0 0 24px -10px var(--glow);transition:transform .15s;position:relative}
.ca-card:hover{transform:translateY(-6px) scale(1.03);box-shadow:0 0 30px -6px var(--glow)}
.ca-card>img{width:100%;aspect-ratio:1/1;object-fit:cover}
.ca-info{padding:8px 10px}
.ca-name{font-weight:800;font-size:14px}
.ca-hp{font-size:12px;color:#ff9d9d;font-weight:700;margin-top:2px}
.ca-talent{position:absolute;top:6px;left:6px;font-size:9px;font-weight:800;color:#1a1206;
  background:linear-gradient(135deg,var(--gold),var(--gold2));border-radius:5px;padding:2px 6px}

/* zoom collection avec description objet */
.zoom-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;max-width:90vw}
.zoom-info{background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:14px 18px;max-width:340px;text-align:center}
.zoom-title{font-family:var(--display);font-size:22px;letter-spacing:.5px}
.zoom-kind{font-size:11px;color:var(--gold);font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin:3px 0 7px}
.zoom-text{font-size:13px;color:var(--muted);line-height:1.5}

/* ============================================================ ANIMATIONS DE COMBAT ============================================================ */
/* énergie volante */
.anim-energy-orb{position:fixed;width:30px;height:30px;border-radius:50%;z-index:96;pointer-events:none;
  background:radial-gradient(circle at 35% 30%, #fff, var(--ecol,#ffd24b) 65%, transparent);
  box-shadow:0 0 18px 4px var(--ecol,#ffd24b);transform:translate(-50%,-50%) scale(1);
  transition:left .45s cubic-bezier(.5,0,.4,1), top .45s cubic-bezier(.5,0,.4,1), transform .45s, opacity .45s}
@keyframes fx-energized-k{0%{box-shadow:0 0 0 0 rgba(255,210,75,.7)}100%{box-shadow:0 0 0 22px rgba(255,210,75,0)}}
.fx-energized{animation:fx-energized-k .6s ease-out}
/* pose de carte : impact + flash */
@keyframes fx-place-k{0%{transform:scale(.6) translateY(-18px);opacity:.2}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.fx-place{animation:fx-place-k .55s cubic-bezier(.2,.9,.3,1.3)}
/* pioche : la pile pulse */
@keyframes fx-draw-k{0%{transform:translateY(0)}30%{transform:translateY(-8px) scale(1.06);box-shadow:0 0 16px var(--gold)}100%{transform:translateY(0)}}
.fx-draw{animation:fx-draw-k .5s ease-out}
/* retraite : glisse */
@keyframes fx-retreat-k{0%{transform:translateX(-40px) scale(.9);opacity:.3}100%{transform:translateX(0) scale(1);opacity:1}}
.fx-retreat{animation:fx-retreat-k .55s ease-out}
/* attaque : charge */
@keyframes fx-lunge-up-k{0%{transform:translateY(0)}35%{transform:translateY(-26px) scale(1.06)}100%{transform:translateY(0)}}
@keyframes fx-lunge-down-k{0%{transform:translateY(0)}35%{transform:translateY(26px) scale(1.06)}100%{transform:translateY(0)}}
.fx-lunge-up{animation:fx-lunge-up-k .42s ease-in-out;z-index:5}
.fx-lunge-down{animation:fx-lunge-down-k .42s ease-in-out;z-index:5}
/* KO : tremblement + fondu rouge */
@keyframes fx-ko-k{0%{filter:none}20%{filter:brightness(2) saturate(.5)}100%{transform:scale(.85) rotate(-3deg);opacity:.4;filter:grayscale(.7)}}
.fx-ko{animation:fx-ko-k .7s forwards}
.anim-ko-boom{position:fixed;width:30px;height:30px;border-radius:50%;z-index:97;pointer-events:none;
  transform:translate(-50%,-50%);background:radial-gradient(circle,#fff,#ffb347 40%,#ff5d5d 70%,transparent);
  animation:ko-boom-k .7s ease-out forwards}
@keyframes ko-boom-k{0%{opacity:1;transform:translate(-50%,-50%) scale(.3)}100%{opacity:0;transform:translate(-50%,-50%) scale(7)}}

/* ============================================================ FOIL DIVINE (au-dessus de mythic) ============================================================ */
.foil-divine::after{
  content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;opacity:0;transition:opacity .3s;
  background:
    conic-gradient(from 0deg,
      rgba(255,244,207,.75),rgba(255,216,107,.7),rgba(255,255,255,.85),
      rgba(255,200,120,.7),rgba(255,244,207,.75));
  background-size:200% 200%;
  animation:mythic-pulse 3s ease infinite, prism-rotate 4s linear infinite;
  mix-blend-mode:color-dodge}
.foil-divine::before{content:"";position:absolute;inset:-50%;pointer-events:none;
  background:conic-gradient(from 0deg,transparent 0 8deg,rgba(255,255,255,.32) 8deg 11deg,transparent 11deg 24deg);
  animation:prism-rotate 7s linear infinite;opacity:0;transition:opacity .3s;mix-blend-mode:screen}
.foil-divine:hover::after,.foil-divine.always::after{opacity:1}
.foil-divine:hover::before,.foil-divine.always::before{opacity:.9}
.card.r-divine,.fcard.foil-divine{box-shadow:0 0 34px -6px rgba(255,236,170,.9)}

.pity-zone{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 18px}
.pity-bar{flex:1;min-width:240px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 14px}
.pity-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.pity-label{font-family:var(--display);font-size:14px;letter-spacing:1px;text-transform:uppercase}
.pity-label.myth{color:#ff5db0}
.pity-label.div{color:#ffd86b}
.pity-count{font-size:11px;color:var(--muted);font-weight:700}
.pity-track{height:9px;border-radius:6px;background:var(--bg2);overflow:hidden;border:1px solid var(--line2)}
.pity-fill{height:100%;border-radius:6px;transition:width .5s}
.pity-fill.myth{background:linear-gradient(90deg,#ff5db0,#7af0ff)}
.pity-fill.div{background:linear-gradient(90deg,#ffd86b,#fff4cf)}

          "energy_universelle","energy_bleue","haricot","villagedufeu","armure","robeakatsuki","energy_verte"] },
  { lvl:4, name:"Le Masque", boss:"obitoE", anime:"naruto",
    intro:"Obito amène la Guerre. Ses corps ne tombent pas facilement.",
    deck:["obitoE","obitoE","itachiE","minatoSage","sasukeAkatsuki","minatoSage","painE",
          "energy_verte","energy_verte","energy_bleue","energy_universelle","energy_verte","energy_bleue",
          "energy_universelle","energy_verte","haricot","haricot","robeakatsuki","armure","capsulecorp"] },
  { lvl:5, name:"Apocalypse", boss:"madaraE", anime:"all",
    intro:"Madara, Freezer et Kid Buu unissent leur puissance. Peu en reviennent.",
    deck:["madaraE","kidbuuE","freezerE","madaraE","kidbuuE","obitoE","freezerE",
          "energy_rouge","energy_bleue","energy_universelle","energy_universelle","energy_rouge","energy_bleue",
          "energy_universelle","energy_verte","haricot","haricot","robeakatsuki","armure","capsulecorp"] },
];

/* ============================================================
   IA — profil par niveau (monte en difficulté)
   smartAttack : choisit la meilleure attaque / anticipe la faiblesse
   useUtil     : agressivité d'utilisation des utilitaires (0..1)
   benchFill   : tendance à remplir le banc (0..1)
   lookahead   : retraite/anticipation tactique (0..1)
   ============================================================ */
const AI_PROFILE = {
  1:{smartAttack:0.30, useUtil:0.25, benchFill:0.40, lookahead:0.10, hpBoost:1.00, energyPerTurn:1, bestHand:0.0, extraDraw:0},
  2:{smartAttack:0.55, useUtil:0.45, benchFill:0.55, lookahead:0.30, hpBoost:1.05, energyPerTurn:1, bestHand:0.3, extraDraw:0},
  3:{smartAttack:0.85, useUtil:0.80, benchFill:0.85, lookahead:0.70, hpBoost:1.25, energyPerTurn:2, bestHand:0.8, extraDraw:1},
  4:{smartAttack:0.95, useUtil:0.92, benchFill:0.95, lookahead:0.88, hpBoost:1.45, energyPerTurn:2, bestHand:1.0, extraDraw:1},
  5:{smartAttack:1.00, useUtil:1.00, benchFill:1.00, lookahead:1.00, hpBoost:1.70, energyPerTurn:3, bestHand:1.0, extraDraw:2},
};

<script>
/* ============================================================
   VFX — chaque effet est un overlay temporaire injecté au-dessus
   de la cible. Rendu via SVG/CSS, nettoyé après l'animation.
   playVFX(vfxId, targetEl, fromPlayer) → Promise (résolue à la fin)
   ============================================================ */
function vfxLayer(){
  let l = document.getElementById("vfxLayer");
  if(!l){ l=document.createElement("div"); l.id="vfxLayer"; document.body.appendChild(l); }
  return l;
}
function rectOf(el){ if(!el||!el.getBoundingClientRect){ return {x:0,y:0,w:0,h:0,cx:0,cy:0}; } const r=el.getBoundingClientRect(); return {x:r.left,y:r.top,w:r.width,h:r.height,cx:r.left+r.width/2,cy:r.top+r.height/2}; }

function spawn(html, ms){
  const layer = vfxLayer();
  const wrap = document.createElement("div");
  wrap.className = "vfx-inst";
  wrap.innerHTML = html;
  layer.appendChild(wrap);
  return new Promise(res=> setTimeout(()=>{ wrap.remove(); res(); }, ms));
}

/* impact générique : shake + flash sur la cible */
function impact(targetEl, color){
  if(!targetEl) return;
  targetEl.classList.add("hit-shake");
  const r = rectOf(targetEl);
  spawn(`<div class="vfx-flash" style="left:${r.cx}px;top:${r.cy}px;--fc:${color}"></div>`, 420);
  setTimeout(()=> targetEl.classList.remove("hit-shake"), 420);
}

/* Particules d'impact */
function burst(r, color, n=14){
  let dots="";
  for(let i=0;i<n;i++){
    const a=(Math.PI*2*i)/n + Math.random()*.4;
    const d=40+Math.random()*60;
    dots+=`<span class="pburst" style="--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px;--pc:${color};--dl:${Math.random()*.1}s"></span>`;
  }
  return spawn(`<div class="vfx-burst" style="left:${r.cx}px;top:${r.cy}px">${dots}</div>`, 700);
}

const VFX = {
  slash(from,to,color){
    const r=rectOf(to);
    impact(to,"#fff");
    burst(r,color,10);
    return spawn(`<div class="vfx-slash" style="left:${r.cx}px;top:${r.cy}px">
      <span style="--rot:25deg"></span><span style="--rot:-15deg;--dl:.08s"></span><span style="--rot:55deg;--dl:.16s"></span>
    </div>`, 600);
  },
  kunai(from,to,color){
    const a=rectOf(from), r=rectOf(to);
    impact(to,"#cfe");
    let k="";
    for(let i=0;i<5;i++) k+=`<span class="kunai" style="--sx:${a.cx}px;--sy:${a.cy}px;--ex:${r.cx+(Math.random()*40-20)}px;--ey:${r.cy+(Math.random()*40-20)}px;--dl:${i*.06}s"></span>`;
    burst(r,"#9adfff",8);
    return spawn(`<div class="vfx-proj">${k}</div>`, 650);
  },
  rasengan(from,to,color){
    const r=rectOf(to);
    impact(to,"#6ad6ff");
    burst(r,"#6ad6ff",18);
    return spawn(`<div class="vfx-orb rasengan" style="left:${r.cx}px;top:${r.cy}px"><span></span><span></span><span></span></div>`, 750);
  },
  chidori(from,to,color){
    const r=rectOf(to);
    impact(to,"#aee6ff");
    let bolts="";
    for(let i=0;i<7;i++) bolts+=`<span class="bolt" style="--rot:${i*51}deg;--dl:${Math.random()*.15}s"></span>`;
    burst(r,"#bfeaff",12);
    return spawn(`<div class="vfx-elec" style="left:${r.cx}px;top:${r.cy}px">${bolts}</div>`, 700);
  },
  fireball(from,to,color){
    const a=rectOf(from), r=rectOf(to);
    impact(to,"#ff9b3d");
    burst(r,"#ff7a1a",16);
    return spawn(`<div class="vfx-fire" style="--sx:${a.cx}px;--sy:${a.cy}px;--ex:${r.cx}px;--ey:${r.cy}px"><span></span></div>`, 720);
  },
  kamehameha(from,to,color){ return beamLike(from,to,"#5fd0ff","#bff2ff","kame"); },
  beam(from,to,color){ return beamLike(from,to,"#a06bff","#e9d6ff","beam"); },
  finalflash(from,to,color){ return beamLike(from,to,"#ffd24b","#fff3c4","flash",true); },
  ki_explosion(from,to,color){
    const r=rectOf(to);
    impact(to,"#ffe08a");
    burst(r,"#ffcf5a",22);
    return spawn(`<div class="vfx-aura" style="left:${r.cx}px;top:${r.cy}px"><span></span><span></span></div>`, 760);
  },
  genjutsu(from,to,color){
    const r=rectOf(to);
    impact(to,"#ff4d6d");
    return spawn(`<div class="vfx-genjutsu" style="left:${r.cx}px;top:${r.cy}px"><span></span><span></span><span></span></div>`, 820);
  },
  shadow(from,to,color){
    const r=rectOf(to);
    impact(to,"#9b8cff");
    return spawn(`<div class="vfx-shadow" style="left:${r.cx}px;top:${r.cy}px"></div>`, 600);
  },
  meteor(from,to,color){
    const r=rectOf(to);
    impact(to,"#ff8a3d");
    let m="";
    for(let i=0;i<6;i++) m+=`<span class="meteor" style="--ex:${r.cx+(Math.random()*120-60)}px;--ey:${r.cy+(Math.random()*40-20)}px;--dl:${i*.1}s"></span>`;
    burst(r,"#ff7a1a",20);
    return spawn(`<div class="vfx-meteors">${m}</div>`, 950);
  },
  dark_sphere(from,to,color){
    const r=rectOf(to);
    impact(to,"#c061ff");
    burst(r,"#b061ff",20);
    return spawn(`<div class="vfx-dark" style="left:${r.cx}px;top:${r.cy}px"><span></span><span></span></div>`, 850);
  },
  void(from,to,color){
    const r=rectOf(to);
    impact(to,"#7c5cff");
    return spawn(`<div class="vfx-void" style="left:${r.cx}px;top:${r.cy}px"></div>`, 780);
  },
};

function beamLike(from,to,c1,c2,cls,big){
  const a=rectOf(from), r=rectOf(to);
  const dx=r.cx-a.cx, dy=r.cy-a.cy;
  const len=Math.hypot(dx,dy);
  const ang=Math.atan2(dy,dx)*180/Math.PI;
  impact(to,c2);
  burst(r,c1,big?24:16);
  return spawn(`<div class="vfx-beam ${cls}" style="left:${a.cx}px;top:${a.cy}px;width:${len}px;transform:rotate(${ang}deg);--c1:${c1};--c2:${c2}">
    <div class="beam-core"></div><div class="beam-charge"></div>
  </div>`, big?900:760);
}

function playVFX(vfxId, fromEl, toEl){
  const fn = VFX[vfxId] || VFX.slash;
  const color = "#ffd24b";
  return Promise.resolve(fn(fromEl||toEl, toEl, color));
}

</script>
<script>
/* ============================================================
   ANIME TCG v6 — COMBAT
   Deck 20 / pile / main / défausse / banc 5 / actif.
   IA tactique qui monte en difficulté et joue ses utilitaires.
   ============================================================ */

/* ============================================================ ONGLET HISTOIRE ============================================================ */
function renderStory(){
  app().innerHTML=`
    <div class="section-head"><h2>Mode Histoire</h2>
      <p class="sub">Combats façon Pocket : deck de ${DECK_SIZE} cartes, ${POINTS_TO_WIN} K.O. pour gagner. L'adversaire devient plus malin à chaque niveau. Victoire ${BATTLE_REWARD.win} ${coinImg()}, défaite ${BATTLE_REWARD.lose} ${coinImg()}.</p></div>
    <div class="stages">
      ${STAGES.map(s=>{
        const locked=s.lvl>maxStage, cleared=s.lvl<maxStage, boss=COMBAT_POOL[s.boss];
        return `<div class="stage ${locked?'locked':''} ${cleared?'cleared':''}">
          <div class="stage-num">${String(s.lvl).padStart(2,'0')}</div>
          <div class="stage-portrait" style="${rarVars(boss.rarity)}">
            <img src="${img(boss.img)}" alt="${boss.name}" onerror="this.style.opacity=.2">
            ${locked?`<div class="lock">🔒</div>`:''}${cleared?`<div class="clear-badge">✓ Vaincu</div>`:''}</div>
          <div class="stage-info">
            <div class="stage-name">${s.name}<span class="ai-tag">IA niv. ${s.lvl}</span></div>
            <div class="stage-boss">Boss · ${boss.name}</div>
            <p class="stage-intro">${locked?'Termine le niveau précédent pour débloquer.':s.intro}</p>
            <button class="stage-btn" data-lvl="${s.lvl}" ${locked?'disabled':''}>${locked?'Verrouillé':(cleared?'Rejouer':'Combattre')}</button>
          </div></div>`;
      }).join("")}
    </div>`;
  document.querySelectorAll(".stage-btn").forEach(b=>{ if(!b.disabled) b.onclick=()=>openDeckBuilder(parseInt(b.dataset.lvl)); });
}

/* ============================================================ DECK BUILDER ============================================================ */
let buildLvl=1, deckSel=[];
function isFighter(id){ return COMBAT_POOL[id] && COMBAT_POOL[id].attacks; }
function ownedDeckables(){
  const list=[];
  for(const [id,n] of Object.entries(collection)){
    if(n>0 && (isFighter(id) || ENERGY_CARDS[id] || UTILS[id])) list.push({id,n});
  }
  return list;
}
function cardMeta(id){
  if(isFighter(id)) return {...COMBAT_POOL[id], cat:"fighter"};
  if(ENERGY_CARDS[id]) return {...ENERGY_CARDS[id], cat:"energy"};
  if(UTILS[id]) return {...UTILS[id], cat:"util"};
  return null;
}
function openDeckBuilder(lvl){
  buildLvl=lvl;
  deckSel=(savedDeck||[]).filter(id=>collection[id]>0).slice(0,DECK_SIZE);
  renderDeckBuilder();
}
function deckCountOf(id){ return deckSel.filter(x=>x===id).length; }
function renderDeckBuilder(){
  const owned=ownedDeckables();
  const stage=STAGES.find(s=>s.lvl===buildLvl), boss=COMBAT_POOL[stage.boss];
  const nbFighters=deckSel.filter(isFighter).length;
  const full=deckSel.length===DECK_SIZE;
  const ready = full && nbFighters>=MIN_FIGHTERS;
  let btnLabel;
  if(ready) btnLabel="Lancer le combat ⚔";
  else if(!full) btnLabel=`Choisis ${DECK_SIZE-deckSel.length} carte(s)`;
  else btnLabel=`Ajoute ${MIN_FIGHTERS-nbFighters} combattante(s)`;
  app().innerHTML=`
    <div class="section-head"><h2>Niveau ${buildLvl} · ${stage.name}</h2>
      <p class="sub">Compose ton deck de ${DECK_SIZE} cartes (min. ${MIN_FIGHTERS} combattantes, doubles autorisés). Adversaire : ${boss.name} — IA niveau ${buildLvl}.</p></div>
    <div class="deck-zone">
      <div class="deck-counter">
        <span class="dc-num ${full?'ok':''}">${deckSel.length}/${DECK_SIZE}</span> cartes ·
        <span class="dc-fighters ${nbFighters>=MIN_FIGHTERS?'ok':'bad'}">${nbFighters} combattante(s)</span>
      </div>
      <div class="deck-slots">
        ${Array.from({length:DECK_SIZE}).map((_,i)=>{
          const id=deckSel[i]; if(!id) return `<div class="slot empty">+</div>`;
          const c=cardMeta(id);
          return `<div class="slot filled" data-rm="${i}" style="${rarVars(c.rarity)}" title="${c.name}">
            <img src="${img(c.img)}" alt="${c.name}" onerror="this.style.opacity=.2">
            <div class="slot-cat ${c.cat}">${c.cat==='fighter'?'⚔':(c.cat==='energy'?'⚡':'◆')}</div>
            <div class="slot-x">✕</div></div>`;
        }).join("")}
      </div>
      <button class="fight-btn" ${ready?'':'disabled'}>${btnLabel}</button>
    </div>
    <div class="lib-tabs">
      <button class="lib-tab active" data-cat="all">Tout</button>
      <button class="lib-tab" data-cat="fighter">Combat</button>
      <button class="lib-tab" data-cat="energy">Énergies</button>
      <button class="lib-tab" data-cat="util">Objets</button>
    </div>
    ${owned.length===0?`<p class="empty-note">Tu n'as encore aucune carte. Ouvre des boosters d'abord !</p>`:''}
    <div class="card-grid" id="libGrid"></div>`;
  let libFilter="all";
  function drawLib(){
    const grid=document.getElementById("libGrid");
    const items=owned.filter(({id})=> libFilter==="all" || cardMeta(id).cat===libFilter)
      .sort((a,b)=>rarityRank(cardMeta(b.id).rarity)-rarityRank(cardMeta(a.id).rarity));
    grid.innerHTML=items.map(({id,n})=>{
      const cap=Math.min(n, MAX_COPIES);
      const used=deckCountOf(id), avail=cap-used;
      return cardEl(id, {count:`${avail}/${cap}`, maxed:avail<=0, data:`data-add="${id}"`});
    }).join("");
    // le clic d'ajout prime sur le zoom dans le builder
    grid.querySelectorAll("[data-add]").forEach(el=>{
      el.removeAttribute("data-zoom");
      el.onclick=()=>{
        const id=el.dataset.add;
        if(deckSel.length>=DECK_SIZE) return;
        if(deckCountOf(id)>=Math.min(collection[id]||0, MAX_COPIES)) return;
        deckSel.push(id); renderDeckBuilder();
      };
    });
  }
  document.querySelectorAll(".lib-tab").forEach(t=> t.onclick=()=>{
    document.querySelectorAll(".lib-tab").forEach(x=>x.classList.remove("active"));
    t.classList.add("active"); libFilter=t.dataset.cat; drawLib();
  });
  document.querySelectorAll(".slot.filled").forEach(s=> s.onclick=()=>{ deckSel.splice(parseInt(s.dataset.rm),1); renderDeckBuilder(); });
  const fb=document.querySelector(".fight-btn");
  if(fb && ready) fb.onclick=()=>{ savedDeck=[...deckSel]; persist(); startBattle(buildLvl,[...deckSel]); };
  drawLib();
}

/* ============================================================ ÉTAT DE COMBAT ============================================================ */
let B=null;
function mkFighter(id, hpBoost){
  const c=COMBAT_POOL[id];
  const hp = hpBoost && hpBoost!==1 ? Math.round(c.hp*hpBoost) : c.hp;
  return { uid:id+"_"+Math.random().toString(36).slice(2,7), id, name:c.name, img:c.img, type:c.type,
    maxHp:hp, hp:hp, baseMaxHp:hp, attacks:c.attacks, cost:c.cost, retreat:c.retreat, rarity:c.rarity,
    talent:c.talent||null, chargeUsed:false, intimidationUsed:false,
    energy:{}, attached:null, bonusDmg:0, ramenTurns:0, status:null, statusTurns:0, ko:false };
}
function mkCard(id){
  if(isFighter(id)) return {kind:'fighter', id};
  if(ENERGY_CARDS[id]) return {kind:'energy', energy:ENERGY_CARDS[id].energy, id};
  if(UTILS[id]) return {kind:'util', id};
  return null;
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function buildSide(deckIds, ai){
  const pile = shuffle(deckIds.map(mkCard).filter(Boolean));
  const side = { pile, hand:[], discard:[], active:null, bench:[],
    energyZone:null, nextEnergy:null, points:0,
    pendingStatus:null, retreatedThisTurn:false, supportThisTurn:false };
  const hpBoost = ai ? ai.hpBoost : 1;
  for(let i=0;i<START_HAND && side.pile.length;i++) side.hand.push(side.pile.shift());

  if(ai && ai.bestHand && Math.random()<ai.bestHand){
    // MAIN TRAFIQUÉE : remonter la meilleure combattante + des énergies depuis la pile
    // 1) meilleure combattante (rareté la plus haute) en main
    const bestFighterIdx = side.pile
      .map((c,i)=>({c,i}))
      .filter(x=>x.c.kind==='fighter')
      .sort((a,b)=>rarityRank(COMBAT_POOL[b.c.id].rarity)-rarityRank(COMBAT_POOL[a.c.id].rarity))[0];
    if(bestFighterIdx){
      const f=side.pile.splice(bestFighterIdx.i,1)[0];
      // libérer une place en renvoyant une carte faible de la main vers la pile
      const weak=side.hand.findIndex(c=>c.kind!=='fighter');
      if(weak>=0){ side.pile.push(side.hand.splice(weak,1)[0]); }
      side.hand.push(f);
    }
    // 2) garantir 2-3 énergies en main
    let energiesInHand = side.hand.filter(c=>c.kind==='energy').length;
    while(energiesInHand<2){
      const ei=side.pile.findIndex(c=>c.kind==='energy');
      if(ei<0) break;
      const e=side.pile.splice(ei,1)[0];
      const weak=side.hand.findIndex(c=>c.kind==='util');
      if(weak>=0) side.pile.push(side.hand.splice(weak,1)[0]);
      side.hand.push(e); energiesInHand++;
    }
    side.pile = shuffle(side.pile);
  }

  if(!side.hand.some(c=>c.kind==='fighter')){
    const fi=side.pile.findIndex(c=>c.kind==='fighter');
    if(fi>=0){ const f=side.pile.splice(fi,1)[0]; side.pile.push(side.hand.shift()); side.hand.push(f); }
  }
  // actif : pour l'IA, prendre la meilleure combattante de la main
  let hf;
  if(ai){
    hf = side.hand
      .map((c,i)=>({c,i}))
      .filter(x=>x.c.kind==='fighter')
      .sort((a,b)=>rarityRank(COMBAT_POOL[b.c.id].rarity)-rarityRank(COMBAT_POOL[a.c.id].rarity))
      .map(x=>x.i)[0];
    if(hf===undefined) hf=-1;
  } else {
    hf=side.hand.findIndex(c=>c.kind==='fighter');
  }
  if(hf>=0){ side.active=mkFighter(side.hand[hf].id, hpBoost); side.hand.splice(hf,1);
    // pré-charge d'énergie sur l'actif IA (avance de jeu) aux niveaux élevés
    if(ai && ai.energyPerTurn>=2){
      const e=TYPE_ENERGY[side.active.type]||"universelle";
      side.active.energy[e]=(side.active.energy[e]||0)+ (ai.energyPerTurn>=3?2:1);
    }
  }
  side._hpBoost = hpBoost;
  return side;
}

function startBattle(lvl, playerDeckIds){
  const stage=STAGES.find(s=>s.lvl===lvl);
  const ai = AI_PROFILE[lvl] || AI_PROFILE[5];
  const player=buildSide(playerDeckIds);
  const enemy=buildSide([...stage.deck], ai);
  enemy.ai = ai;
  B={ lvl, turn:"player", busy:false, log:[], firstTurn:true, player, enemy, mode:null };
  newEnergy(player);
  renderBattle();
  pushLog(`Niveau ${lvl} — IA niveau ${lvl}. À toi de jouer !`);
}

function newEnergy(side){
  // l'énergie du tour correspond au type de la carte active (sinon aléatoire)
  side.energyZone = side.nextEnergy || neededEnergy(side);
  side.nextEnergy = neededEnergy(side);
}
function neededEnergy(side){
  const act=side.active;
  if(act && TYPE_ENERGY[act.type]) return TYPE_ENERGY[act.type];
  return randEnergy();
}
function randEnergy(){ return ENERGY_POOL[Math.floor(Math.random()*ENERGY_POOL.length)]; }
function drawCard(side, silent){
  if(side.pile.length===0){ if(!silent) pushLog("Pile vide — pas de pioche."); return null; }
  const c=side.pile.shift(); side.hand.push(c);
  if(side.hand.length>HAND_MAX) side.discard.push(side.hand.shift());
  return c;
}

/* ---- énergie / coûts ---- */
function energyCount(f){ return Object.values(f.energy).reduce((a,b)=>a+b,0); }
function canPayCost(f, cost){
  const pool={...f.energy}; let need=0;
  for(const [k,v] of Object.entries(cost)){
    if(k==="universelle"){ need+=v; continue; }
    if((pool[k]||0) < v) return false;
    pool[k]-=v;
  }
  return Object.values(pool).reduce((a,b)=>a+b,0)>=need;
}
function costLabel(cost){
  let out=[];
  for(const [k,v] of Object.entries(cost)) for(let i=0;i<v;i++) out.push(`<span class="ecost" style="--ec:${ENERGY[k].color}"></span>`);
  return out.join("");
}
/* attaquant att (objet fighter), défenseur def, attaque atk (objet), côtés */
function effDamage(att, def, base, atk, attSide, defSide){
  let dmg = base + (att.bonusDmg||0);
  const notes=[];

  // --- talent de l'attaquant ---
  if(att.talent){
    const extraEnergy = Math.max(0, energyCount(att) - 2); // au-delà d'un coût "moyen"
    switch(att.talent){
      case "surcharge":{ const per=(atk&&atk.scale)?atk.scale:10; if(extraEnergy>0){ dmg+=extraEnergy*per; notes.push("Surcharge +"+(extraEnergy*per)); } break; }
      case "rivalite":{ if(def && rarityRank(def.rarity)>=3){ dmg+=25; notes.push("Rivalité +25"); } break; }
      case "vengeance":{ if(att.hp/att.maxHp<0.5){ dmg+=30; notes.push("Vengeance +30"); } break; }
      case "fureur":{ const ko=attSide?attSide.discard.filter(c=>c.kind==='fighter').length:0; if(ko>0){ dmg+=ko*10; notes.push("Fureur +"+(ko*10)); } break; }
      case "fusionImparfaite":{ dmg+=20; notes.push("Fusion +20"); break; }
    }
  }
  // --- bonus depuis le banc de l'attaquant (mentor) ---
  if(attSide){
    for(const b of attSide.bench){ if(b&&!b.ko&&b.talent==='mentor'){ dmg+=15; notes.push("Mentor +15"); break; } }
  }
  // --- réduction depuis le banc du défenseur (gardien) ---
  if(defSide){
    for(const b of defSide.bench){ if(b&&!b.ko&&b.talent==='gardien'){ dmg=Math.max(0,dmg-10); notes.push("Gardien -10"); break; } }
  }
  // --- faiblesse de type (ignorée si le défenseur a la Roue de Mahoraga) ---
  let weak=false;
  const defIgnoresWeak = def && def.attached==='mahogararoue';
  if(def && WEAKNESS[def.type] && WEAKNESS[def.type]===att.type && !defIgnoresWeak){ dmg=Math.round(dmg*WEAKNESS_MULT); weak=true; }
  // --- talent Infini du défenseur : -50% si ≥3 énergies ---
  if(def && def.talent==='infini' && energyCount(def)>=3){ dmg=Math.round(dmg*0.5); notes.push("Infini ½"); }
  return {dmg:Math.max(0,Math.round(dmg)), weak, notes};
}

/* lie les loupes d'inspection (actif + banc, deux côtés) */

function energyStack(f){

  for(const [k,v] of Object.entries(f.energy)) for(let i=0;i<v;i++) out+=`<span class="eatt" style="--ec:${ENERGY[k].color}"></span>`;

function statusBadge(f){

function renderHand(){

  if(P.hand.length===0) return `<div class="hand-empty">Main vide</div>`;

        <img src="${img(e.img)}" alt="" onerror="this.style.opacity=.2"><span class="hlabel">${e.label}</span></div>`;
    } else if(card.kind==='fighter'){
      const c=COMBAT_POOL[card.id];
      return `<div class="hcard fighter" data-hand="${idx}" style="${rarVars(c.rarity)}" title="${c.name} · ${c.hp} PV">
        <img src="${img(c.img)}" alt="" onerror="this.style.opacity=.2"><span class="hcard-hp">${c.hp}</span><span class="hlabel">${c.name}</span></div>`;
    } else {
      const u=UTILS[card.id];
      return `<div class="hcard util ${u.kind}" data-hand="${idx}" title="${u.desc}">
        <img src="${img(u.img)}" alt="" onerror="this.style.opacity=.2"><span class="hlabel">${u.name}</span></div>`;
    }
  }).join("");
}

function bindControls(){
  if(B.turn!=="player"||B.busy) return;
  if(B.mode==="attach"){
    attachClickTargets(f=>attachEnergyTo(f)); bindCancel(()=>{B.mode=null;renderBattle();}); return;
  }
  if(B.mode==="attachHand"){
    attachClickTargets(f=>{
      f.energy[B.handEnergyEnergy]=(f.energy[B.handEnergyEnergy]||0)+1;
      pushLog(`Énergie ${ENERGY[B.handEnergyEnergy].label} attachée à ${f.name}.`);
      B.player.discard.push(B.player.hand.splice(B.handEnergyIdx,1)[0]);
      B.mode=null; renderBattle();
    }); bindCancel(()=>{B.mode=null;renderBattle();}); return;
  }
  if(["haricot","armure","ramen","robe"].includes(B.mode)){
    attachClickTargets(f=>applyTargetedUtil(f)); bindCancel(()=>{B.mode=null;B.pendingUtil=null;renderBattle();}); return;
  }
  if(B.mode==="benchPlace"){
    bindHandFighterPick((id,idx)=>{
      if(B.player.bench.length>=BENCH_SIZE){ pushLog("Banc plein."); B.mode=null; return renderBattle(); }
      B.player.bench.push(mkFighter(id)); B.player.hand.splice(idx,1);
